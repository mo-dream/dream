<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Elite POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; background: #f0f2f5; color: #1e293b;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800"><text x="50%" y="50%" font-size="50" font-weight="900" fill="rgba(79, 70, 229, 0.02)" font-family="Arial" text-anchor="middle" transform="rotate(-25 400 400)">DREAM SYSTEMS</text></svg>');
            background-attachment: fixed;
        }
        .dream-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-radius: 28px; border: 1px solid #fff; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); transition: 0.3s; }
        .dream-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
        .tab-active { background: linear-gradient(135deg, #4f46e5, #6366f1) !important; color: white !important; transform: scale(1.05); }
        input, select { border: 2px solid #e2e8f0 !important; padding: 14px; border-radius: 16px; font-weight: 700; outline: none; background: white !important; transition: 0.2s; }
        input:focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .btn-template { background: #fff; border: 2px solid #f1f5f9; border-radius: 14px; font-weight: 900; transition: 0.2s; }
        .btn-template:hover { background: #4f46e5; color: white; border-color: #4f46e5; }
        @media print { .no-print { display: none; } #print-area { display: block !important; width: 80mm; font-family: 'Arial'; padding: 5mm; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        // ألوان ذكية للأقسام
        const getCatColor = (cat) => {
            const colors = {
                'مشروبات': 'bg-blue-100 text-blue-700',
                'لحوم': 'bg-red-100 text-red-700',
                'مقبلات': 'bg-emerald-100 text-emerald-700',
                'مشويات': 'bg-orange-100 text-orange-700',
                'حلويات': 'bg-pink-100 text-pink-700',
                'عام': 'bg-slate-100 text-slate-700'
            };
            return colors[cat] || 'bg-indigo-100 text-indigo-700';
        };

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0, orders: [] });
            const [chat, setChat] = useState([]);
            const [msgInput, setMsgInput] = useState('');
            const [licenseInput, setLicenseInput] = useState('');
            const [showChat, setShowChat] = useState(false);
            const [newItem, setNewItem] = useState({ name: '', price: '', category: '', unit: 'piece' });

            useEffect(() => {
                if (tenant) {
                    const checkTenant = async () => {
                        const { data } = await client.from('tenants').select('*').eq('id', tenant.id).maybeSingle();
                        if (!data) { logout(); } else { setTenant(data); loadData(); loadStats(); loadChat(); }
                    };
                    checkTenant();
                }
            }, []);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('*, order_items(*)').eq('tenant_id', tenant.id).gte('created_at', today).order('created_at', {ascending: false});
                const { data: e } = await client.from('expenses').select('*').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ sales: s?.reduce((a,b)=>a+b.total_amount, 0)||0, expenses: e?.reduce((a,b)=>a+b.amount, 0)||0, orders: s || [] });
            }

            async function loadChat() {
                const { data } = await client.from('support_messages').select('*').eq('tenant_id', tenant.id).order('created_at');
                if(data) setChat(data);
            }

            const logout = () => { localStorage.removeItem('dream_session'); setTenant(null); window.location.reload(); };

            const addToCart = (item, qty, label) => {
                setCart([...cart, { ...item, cart_qty: qty, price: item.price * qty, cart_label: label, note: '', id: Date.now(), original_id: item.id }]);
            };

            const checkout = async () => {
                if(!cart.length) return;
                const total = cart.reduce((a,b)=>a+b.price, 0);
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: total }]).select().single();
                const orderItems = cart.map(c => ({ order_id: order.id, product_name: c.name, qty: c.cart_qty, price: c.price, item_note: c.note }));
                await client.from('order_items').insert(orderItems);
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: (t.stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                }
                window.print(); window.location.reload();
            };

            const updateSettings = async (field, value) => {
                const updated = { ...tenant, [field]: value };
                setTenant(updated);
                localStorage.setItem('dream_session', JSON.stringify(updated));
                await client.from('tenants').update({ [field]: value }).eq('id', tenant.id);
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 text-white text-center">
                    <div className="w-full max-w-sm">
                        <h1 className="text-4xl font-black mb-10 italic tracking-tighter">DREAM SYSTEMS</h1>
                        <input className="mb-4 text-center text-2xl !p-6 w-full shadow-2xl" placeholder="كود التفعيل DRM-XXXX" onChange={e=>setLicenseInput(e.target.value.toUpperCase())} />
                        <button onClick={async ()=>{
                            const {data} = await client.from('tenants').select('*').eq('license_key', licenseInput).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); window.location.reload(); } else alert("الكود غير صحيح");
                        }} className="w-full py-5 bg-indigo-600 rounded-2xl font-black text-xl shadow-xl hover:bg-indigo-500">دخول للنظام 🚀</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* الفاتورة المطبوعة */}
                    <div id="print-area" className="hidden">
                        <div className="text-center" style={{borderBottom:'1px dashed #000', marginBottom:'10px', paddingBottom:'10px'}}>
                            <h2 style={{fontSize:'22px', fontWeight:'900', textTransform:'uppercase'}}>{tenant.business_name}</h2>
                            <p style={{fontSize:'14px'}}>رقم الهاتف: {tenant.phone_number || 'غير متوفر'}</p>
                            <p style={{fontSize:'12px'}}>{new Date().toLocaleString()}</p>
                        </div>
                        <table style={{width:'100%', fontSize:'14px'}}>
                            <tbody>
                                {cart.map((c, i) => (
                                    <tr key={i}><td align="right"><b>{c.name}</b><br/><small>{c.cart_label}</small></td><td align="left">{c.price.toLocaleString()}</td></tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="text-center" style={{borderTop:'2px solid #000', marginTop:'15px', paddingTop:'10px'}}>
                            <h3 style={{fontSize:'20px', fontWeight:'900'}}>المجموع: {cart.reduce((a,b)=>a+b.price, 0).toLocaleString()} د.ع</h3>
                        </div>
                    </div>

                    <header className="bg-white/80 backdrop-blur-md p-4 border-b flex justify-between items-center sticky top-0 z-40 no-print shadow-sm">
                        <div className="flex flex-col">
                            <h1 className="font-black text-2xl text-indigo-700 tracking-tighter italic uppercase leading-none">{tenant.business_name}</h1>
                            <span className="text-[10px] text-slate-400 font-bold mt-1">DREAM SYSTEMS CLOUD POS</span>
                        </div>
                        <div className="flex bg-slate-100 p-1.5 rounded-2xl gap-1 text-[10px] md:text-xs">
                            <button onClick={()=>setView('pos')} className={`px-5 py-2.5 rounded-xl font-black transition-all ${view==='pos'?'tab-active':'text-slate-500'}`}>البيع</button>
                            <button onClick={()=>setView('inventory')} className={`px-5 py-2.5 rounded-xl font-black transition-all ${view==='inventory'?'tab-active':'text-slate-500'}`}>المنيو</button>
                            <button onClick={()=>setView('reports')} className={`px-5 py-2.5 rounded-xl font-black transition-all ${view==='reports'?'tab-active':'text-slate-500'}`}>التقارير</button>
                            <button onClick={()=>setView('settings')} className={`px-5 py-2.5 rounded-xl font-black transition-all ${view==='settings'?'tab-active':'text-slate-500'}`}>الإعدادات</button>
                            <button onClick={()=>setShowChat(true)} className="px-3 py-2.5 rounded-xl bg-amber-400 text-amber-900 font-black relative">الدعم</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-7xl mx-auto w-full no-print">
                        {/* واجهة البيع */}
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_400px] gap-8">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {items.map(item => (
                                        <div key={item.id} className="dream-card p-6 cursor-pointer border-2 border-transparent hover:border-indigo-400" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'قطعة')}>
                                            <span className={`text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${getCatColor(item.category)}`}>{item.category}</span>
                                            <h3 className="font-black text-xl text-slate-800 mt-3">{item.name}</h3>
                                            <div className="font-black text-indigo-600 text-lg mt-1">{item.price.toLocaleString()} <small className="text-[10px]">د.ع</small></div>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-3 gap-2 mt-5">
                                                    <button onClick={(e)=>{e.stopPropagation(); addToCart(item, 1, 'كيلو')}} className="btn-template p-2 text-xs">كيلو</button>
                                                    <button onClick={(e)=>{e.stopPropagation(); addToCart(item, 0.5, 'نصف')}} className="btn-template p-2 text-xs">نصف</button>
                                                    <button onClick={(e)=>{e.stopPropagation(); addToCart(item, 0.25, 'ربع')}} className="btn-template p-2 text-xs">ربع</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {items.length === 0 && <div className="col-span-full py-20 text-center opacity-30 italic font-black text-2xl">المنيو فارغ، أضف مواد من صفحة المنيو</div>}
                                </div>

                                {/* الفاتورة الجانبية */}
                                <div className="dream-card h-[82vh] flex flex-col sticky top-28 overflow-hidden bg-white border-indigo-100 border-2">
                                    <div className="p-5 bg-indigo-700 text-white font-black text-center text-xs tracking-[0.3em] uppercase">Current Order</div>
                                    <div className="flex-1 overflow-y-auto p-5 space-y-5">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex flex-col border-b border-slate-100 pb-4">
                                                <div className="flex justify-between items-center font-black">
                                                    <div><p className="text-slate-800">{c.name}</p><small className="text-indigo-500 font-bold">{c.cart_label}</small></div>
                                                    <div className="flex items-center gap-4"><span>{c.price.toLocaleString()}</span><button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500 text-lg">✕</button></div>
                                                </div>
                                                <input className="!p-2 text-[10px] mt-3 !bg-slate-50 !border-none" placeholder="إضافة ملاحظة (مثلا: بدون فلفل)..." value={c.note} onChange={e=>{const n=[...cart]; n[i].note=e.target.value; setCart(n);}} />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-8 bg-slate-50 border-t-2 border-dashed border-slate-200">
                                        <div className="flex justify-between font-black text-3xl mb-6 text-slate-900"><span>المجموع</span><span>{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span></div>
                                        <button onClick={checkout} className="w-full py-5 bg-emerald-600 text-white rounded-3xl font-black text-2xl shadow-xl shadow-emerald-100 hover:bg-emerald-500 active:scale-95 transition-all">تأكيد وطباعة ✅</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* المنيو والمخزن */}
                        {view === 'inventory' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="dream-card p-10">
                                    <h2 className="text-3xl font-black mb-8 text-indigo-700 italic">✨ إضافة مادة جديدة للمنيو</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                                        <div className="flex flex-col gap-2"><label className="text-xs font-black text-slate-400 mr-2">اسم المادة</label><input placeholder="مثلاً: كباب لحم" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} /></div>
                                        <div className="flex flex-col gap-2"><label className="text-xs font-black text-slate-400 mr-2">القسم</label><input placeholder="لحوم، مشروبات..." value={newItem.category} onChange={e=>setNewItem({...newItem, category:e.target.value})} /></div>
                                        <div className="flex flex-col gap-2"><label className="text-xs font-black text-slate-400 mr-2">سعر البيع</label><input type="number" placeholder="0" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} /></div>
                                        <div className="flex flex-col gap-2"><label className="text-xs font-black text-slate-400 mr-2">نظام الوزن</label><select value={newItem.unit} onChange={e=>setNewItem({...newItem, unit:e.target.value})}><option value="piece">بالقطعة</option><option value="kg">بالكيلو (تفعيل القوالب)</option></select></div>
                                        <button onClick={async ()=>{
                                            if(!newItem.name || !newItem.price) return alert("املاً البيانات");
                                            await client.from('products').insert([{name:newItem.name, price:parseFloat(newItem.price), category:newItem.category||'عام', unit_type:newItem.unit, tenant_id:tenant.id}]);
                                            loadData(); setNewItem({name:'', price:'', category:'', unit:'piece'});
                                        }} className="lg:col-span-4 bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl shadow-lg hover:bg-indigo-500">حفظ في القائمة ✨</button>
                                    </div>
                                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mt-10 border-t pt-10">
                                        {items.map(i => (
                                            <div key={i.id} className="flex justify-between items-center p-5 bg-white border rounded-2xl shadow-sm">
                                                <div><b className="text-lg text-slate-800">{i.name}</b><p className="text-xs text-indigo-500 font-bold">{i.category}</p></div>
                                                <button onClick={async()=> {if(confirm('حذف نهائي؟')){await client.from('products').delete().eq('id',i.id); loadData();}}} className="bg-rose-50 text-rose-500 px-4 py-2 rounded-xl font-black text-xs">حذف</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* التقارير */}
                        {view === 'reports' && (
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="dream-card p-10 bg-indigo-600 text-white text-center border-none shadow-indigo-200 shadow-2xl">
                                        <p className="text-xs font-black opacity-60 uppercase tracking-widest">إجمالي مبيعات اليوم</p>
                                        <h2 className="text-5xl font-black mt-4">{stats.sales.toLocaleString()} <small className="text-sm">د.ع</small></h2>
                                    </div>
                                    <div className="dream-card p-10 bg-rose-500 text-white text-center border-none">
                                        <p className="text-xs font-black opacity-60 uppercase tracking-widest">المسحوبات والمصاريف</p>
                                        <h2 className="text-5xl font-black mt-4">{stats.expenses.toLocaleString()}</h2>
                                    </div>
                                    <div className="dream-card p-10 bg-slate-900 text-white text-center border-none">
                                        <p className="text-xs font-black opacity-60 uppercase tracking-widest">الصافي الفعلي</p>
                                        <h2 className="text-5xl font-black mt-4">{(stats.sales-stats.expenses).toLocaleString()}</h2>
                                    </div>
                                </div>
                                <div className="dream-card p-8">
                                    <h3 className="font-black text-xl mb-6 italic">🧾 آخر الفواتير</h3>
                                    <div className="space-y-3">
                                        {stats.orders.map(o => (
                                            <div key={o.id} className="p-5 border rounded-2xl bg-white flex justify-between items-center shadow-sm">
                                                <div><b className="text-slate-800 text-lg">فاتورة #{o.id}</b><p className="text-xs text-slate-400 font-bold">{new Date(o.created_at).toLocaleTimeString()}</p></div>
                                                <b className="text-indigo-600 text-xl">{o.total_amount.toLocaleString()}</b>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* الإعدادات */}
                        {view === 'settings' && (
                            <div className="max-w-2xl mx-auto space-y-8 animate-in slide-in-from-bottom-10 duration-500">
                                <div className="dream-card p-12">
                                    <h2 className="text-3xl font-black mb-10 text-slate-800 border-b pb-6 italic">⚙️ إعدادات المطعم</h2>
                                    <div className="space-y-8">
                                        <div className="flex flex-col gap-3">
                                            <label className="text-sm font-black text-slate-500 mr-2 uppercase tracking-widest">اسم المطعم / المحل</label>
                                            <input value={tenant.business_name} onChange={e=>updateSettings('business_name', e.target.value)} />
                                        </div>
                                        <div className="flex flex-col gap-3">
                                            <label className="text-sm font-black text-slate-500 mr-2 uppercase tracking-widest">رقم الهاتف (يظهر في الفاتورة)</label>
                                            <input placeholder="مثلاً: 077XXXXXXXX" value={tenant.phone_number || ''} onChange={e=>updateSettings('phone_number', e.target.value)} />
                                        </div>
                                        <div className="p-8 bg-indigo-50 rounded-3xl border-2 border-indigo-100">
                                            <p className="text-xs font-black text-indigo-500 uppercase mb-2">معلومات الاشتراك</p>
                                            <p className="text-slate-700 font-bold">كود التفعيل: <span className="font-mono text-indigo-600">{tenant.license_key}</span></p>
                                            <p className="text-slate-700 font-bold mt-1">تاريخ الانتهاء: {tenant.expiry_date}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* نافذة الدعم */}
                    {showChat && (
                        <div className="fixed bottom-10 left-10 z-[100] dream-card w-full max-w-sm h-[500px] flex flex-col shadow-2xl border-2 border-indigo-500 overflow-hidden animate-in zoom-in duration-300">
                            <div className="p-5 bg-indigo-600 text-white font-black flex justify-between shadow-lg uppercase italic text-xs tracking-widest"><span>Dream Support</span><button onClick={()=>setShowChat(false)} className="text-xl">✕</button></div>
                            <div className="flex-1 p-5 overflow-y-auto bg-slate-50 space-y-4">
                                {chat.map(m=><div key={m.id} className={`p-4 rounded-2xl text-sm font-bold shadow-sm leading-relaxed ${m.sender==='client'?'bg-white mr-auto text-slate-700 rounded-bl-none':'bg-indigo-600 ml-auto text-white rounded-br-none'}`}>{m.message}</div>)}
                                {chat.length === 0 && <div className="text-center py-20 opacity-20 font-black italic">ارسل لنا أي استفسار برمجية</div>}
                            </div>
                            <div className="p-4 border-t flex gap-3 bg-white shadow-inner">
                                <input className="flex-1 !p-3 !text-sm" value={msgInput} onChange={e=>setMsgInput(e.target.value)} placeholder="اكتب هنا..." onKeyPress={e=>e.key==='Enter'&&sendSupportMsg()} />
                                <button onClick={async ()=>{
                                    if(!msgInput.trim()) return;
                                    await client.from('support_messages').insert([{tenant_id:tenant.id, sender:'client', message:msgInput}]);
                                    setMsgInput(''); loadChat();
                                }} className="bg-indigo-600 text-white px-6 rounded-xl font-black text-sm">ارسال</button>
                            </div>
                        </div>
                    )}
                    <footer className="no-print p-10 text-center opacity-20 text-[10px] font-black uppercase tracking-[0.5em] italic">Dream Systems • Basra • 2026</footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
