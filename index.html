<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Visual Pro POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --accent: #6366f1; 
            --bg-img: url('https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=2069&auto=format&fit=crop'); 
        }
        
        /* جزارة ومشويات */
        [data-theme='food'] { 
            --accent: #f97316; 
            --bg-img: url('https://images.unsplash.com/photo-1588123530873-3150ce109927?q=80&w=2000&auto=format&fit=crop');
        }
        /* أسواق ومتاجر */
        [data-theme='retail'] { 
            --accent: #10b981; 
            --bg-img: url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2000&auto=format&fit=crop');
        }
        /* زيوت وسيارات */
        [data-theme='auto'] { 
            --accent: #eab308; 
            --bg-img: url('https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?q=80&w=2000&auto=format&fit=crop');
        }

        body { 
            background-color: #020617; color: #fff; font-family: 'Cairo', sans-serif;
            margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        /* صورة الخلفية مع الطبقة السينمائية */
        .dynamic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.9)), var(--bg-img);
            background-size: cover; background-position: center;
            z-index: -2; transition: background-image 0.8s ease-in-out;
        }

        /* كرت التصميم الزجاجي 3D */
        .visual-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* تحسين مربع الكود - لصق واضح وكتابة سوداء */
        .login-input {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #000 !important; font-weight: 900 !important;
            font-size: 1.5rem !important; text-align: center;
            border-radius: 24px !important; padding: 20px !important;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        .active-tab {
            background: var(--accent) !important;
            color: white !important;
            box-shadow: 0 0 20px var(--accent);
        }

        .neon-border { border-color: var(--accent); }
        .text-accent { color: var(--accent); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body id="body-tag">
    <div class="dynamic-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [license, setLicense] = useState('');

            useEffect(() => {
                if (tenant) {
                    document.getElementById('body-tag').setAttribute('data-theme', tenant.business_type || 'food');
                    loadData();
                }
            }, [tenant]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            const addToCart = (item, qty, label, isPrice = false) => {
                let fQty = isPrice ? parseFloat(qty)/item.price : qty;
                let fPrice = isPrice ? parseFloat(qty) : item.price * qty;
                setCart([...cart, { ...item, cart_qty: fQty, price: fPrice, cart_label: label, id: Date.now(), original_id: item.id }]);
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="visual-card w-full max-w-md p-14 text-center">
                        <div className="w-24 h-24 bg-white/5 rounded-[2rem] mx-auto mb-10 flex items-center justify-center text-5xl font-black italic shadow-inner border border-white/10">D</div>
                        <h1 className="text-4xl font-black mb-12 tracking-widest italic">DREAM SYSTEMS</h1>
                        <div className="space-y-6">
                            <input className="login-input" placeholder="DRM-XXXX" value={license} onChange={e=>setLicense(e.target.value.toUpperCase())} />
                            <button onClick={async ()=>{
                                const {data} = await client.from('tenants').select('*').eq('license_key', license).maybeSingle();
                                if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); } else alert("خطأ في الكود");
                            }} className="w-full py-6 bg-white/10 hover:bg-white/20 rounded-[2rem] font-black text-xl tracking-widest border border-white/20 transition-all">تنشيط السحاب 🚀</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-8 flex justify-between items-center sticky top-0 z-50 no-print">
                        <div className="flex flex-col">
                            <h1 className="font-black text-2xl italic tracking-tighter uppercase text-accent">{tenant.business_name}</h1>
                            <p className="text-[10px] font-black opacity-30 uppercase tracking-[0.4em] mt-1">Premium Visual Node</p>
                        </div>
                        <div className="flex bg-white/5 backdrop-blur-3xl p-2 rounded-3xl border border-white/10 gap-2">
                            {['pos', 'inventory', 'reports'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-8 py-3 rounded-2xl font-black text-[10px] uppercase transition-all ${view===v?'active-tab':'opacity-30 hover:opacity-100'}`}>
                                    {v==='pos'?'Sale':v==='inventory'?'Stock':'Stats'}
                                </button>
                            ))}
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-5 text-rose-500 font-black">✕</button>
                        </div>
                    </header>

                    <main className="p-8 lg:p-12 max-w-[1600px] mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_450px] gap-12">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {items.map(item => (
                                        <div key={item.id} className="visual-card p-8 cursor-pointer group hover:scale-[1.03] transition-all duration-500" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'Unit')}>
                                            <div className="flex justify-between items-start mb-8">
                                                <span className="text-[9px] font-black px-4 py-2 rounded-full bg-white/5 border border-white/10 uppercase opacity-60">{item.category}</span>
                                                <div className="font-black text-xl text-accent">{item.price.toLocaleString()}</div>
                                            </div>
                                            <h3 className="font-bold text-2xl mb-8">{item.name}</h3>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-4 gap-2">
                                                    {[1, 0.5, 0.25].map(w => (
                                                        <button key={w} onClick={(e)=>{e.stopPropagation(); addToCart(item, w, w+' KG')}} className="bg-white/5 hover:bg-white/20 py-3 rounded-2xl text-[11px] font-black">{w}K</button>
                                                    ))}
                                                    <button onClick={(e)=>{e.stopPropagation(); const p=prompt('Amount:'); if(p) addToCart(item, p, p+' IQD', true)}} className="bg-white/10 py-3 rounded-2xl text-[11px] font-black">💰</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="visual-card h-[82vh] flex flex-col sticky top-32 overflow-hidden">
                                    <div className="p-8 bg-white/[0.02] border-b border-white/10 flex justify-between items-center text-[10px] font-black tracking-widest uppercase opacity-40">
                                        <span>Checkout Bag</span>
                                        <div className="w-2 h-2 rounded-full bg-accent animate-ping"></div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-8 space-y-8">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex justify-between items-center animate-in slide-in-from-bottom duration-500">
                                                <div><p className="font-bold text-lg">{c.name}</p><p className="text-[9px] font-black opacity-30 uppercase mt-1">{c.cart_label}</p></div>
                                                <div className="flex items-center gap-8">
                                                    <span className="font-black text-2xl text-accent">{c.price.toLocaleString()}</span>
                                                    <button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500 opacity-30 hover:opacity-100">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-12 bg-white/[0.02] border-t border-white/10">
                                        <div className="flex justify-between items-end mb-12">
                                            <span className="text-[10px] font-black opacity-30 uppercase tracking-[0.5em]">Total</span>
                                            <span className="text-6xl font-black tracking-tighter text-accent">{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span>
                                        </div>
                                        <button onClick={()=>{window.print(); window.location.reload();}} className="w-full py-8 bg-white/5 hover:bg-white/10 rounded-[3rem] font-black text-2xl uppercase tracking-widest border border-white/10">Complete Sale</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
