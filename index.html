<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>Dream Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-8 bg-slate-950 text-white font-sans">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-black text-blue-400 mb-10 italic">✨ DREAM SYSTEMS | ADMIN</h1>
        <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-blue-500/20 shadow-2xl mb-10">
            <h2 class="text-xl font-bold mb-6">🎫 تفعيل اشتراك جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input id="bn" placeholder="اسم المحل" class="bg-slate-800 p-4 rounded-xl outline-none border border-slate-700 focus:border-blue-500 text-white">
                <select id="bt" class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-white">
                    <option value="food">مطعم</option>
                    <option value="retail">أسواق</option>
                </select>
                <input id="ed" type="date" class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-white">
                <button onclick="add()" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-black transition-all">حفظ الكود</button>
            </div>
        </div>
        <div id="list" class="grid gap-4"></div>
    </div>
    <script>
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');
        async function add() {
            const n = document.getElementById('bn').value, t = document.getElementById('bt').value, d = document.getElementById('ed').value;
            const k = "DRM-" + Math.floor(1000 + Math.random() * 9000);
            if(!n || !d) return alert("املاً البيانات");
            const { error } = await client.from('tenants').insert([{ business_name: n, business_type: t, expiry_date: d, license_key: k }]);
            if(!error) { alert("تم الحفظ! الكود: " + k); load(); } else alert("خطأ: " + error.message);
        }
        async function load() {
            const { data } = await client.from('tenants').select('*').order('id', {ascending: false});
            if(data) {
                document.getElementById('list').innerHTML = data.map(i => `
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 flex justify-between shadow-xl">
                        <div><b>${i.business_name}</b> <br/><b class="text-yellow-400 font-mono text-2xl">${i.license_key}</b></div>
                        <div class="text-left"><p class="text-xs">ينتهي: ${i.expiry_date}</p><button onclick="del(${i.id})" class="text-red-500 text-xs mt-3">إلغاء</button></div>
                    </div>`).join('');
            }
        }
        async function del(id) { if(confirm('متأكد؟')) { await client.from('tenants').delete().eq('id', id); load(); } }
        load();
    </script>
</body>
</html>
