<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Next-Gen POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --accent: #6366f1; --bg-img: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop'); }
        [data-theme='food'] { --accent: #ea580c; --bg-img: url('https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='retail'] { --accent: #059669; --bg-img: url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='auto'] { --accent: #ca8a04; --bg-img: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?q=80&w=2000&auto=format&fit=crop'); }

        body { background-color: #020617; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        .dynamic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)), var(--bg-img);
            background-size: cover; background-position: center; z-index: -2; transition: 1s ease-in-out;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 35px;
        }

        input, select {
            background: rgba(255, 255, 255, 0.9) !important;
            color: #000 !important; font-weight: 900 !important;
            border-radius: 18px !important; padding: 14px !important;
            border: none !important;
        }

        .tab-active { background: var(--accent) !important; color: white !important; box-shadow: 0 10px 30px -5px var(--accent); }
        
        /* انميشن الأرقام */
        @keyframes count-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .stat-animate { animation: count-up 0.8s ease-out forwards; }

        @media print { .no-print { display: none; } #print-area { display: block !important; width: 80mm; background: white; color: black; padding: 5mm; } }
    </style>
</head>
<body id="body-tag">
    <div class="dynamic-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        // مكون العداد المتحرك
        const AnimatedNumber = ({ value }) => {
            const [displayValue, setDisplayValue] = useState(0);
            useEffect(() => {
                let start = 0;
                const end = parseInt(value);
                if (start === end) return;
                let timer = setInterval(() => {
                    start += Math.ceil(end / 20);
                    if (start >= end) { setDisplayValue(end); clearInterval(timer); }
                    else { setDisplayValue(start); }
                }, 30);
                return () => clearInterval(timer);
            }, [value]);
            return <span>{displayValue.toLocaleString()}</span>;
        };

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0, orders: [] });
            const [showSupplyModal, setShowSupplyModal] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (tenant) {
                    document.getElementById('body-tag').setAttribute('data-theme', tenant.business_type);
                    loadData(); loadStats();
                }
            }, [tenant]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('*').eq('tenant_id', tenant.id).gte('created_at', today);
                const { data: e } = await client.from('expenses').select('*').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ sales: s?.reduce((a,b)=>a+b.total_amount, 0)||0, expenses: e?.reduce((a,b)=>a+b.amount, 0)||0, orders: s || [] });
            }

            const addToCart = (item, qty, label, isPrice = false) => {
                let fQty = isPrice ? parseFloat(qty)/item.price : qty;
                let fPrice = isPrice ? parseFloat(qty) : item.price * qty;
                setCart([...cart, { ...item, cart_qty: fQty, price: fPrice, cart_label: label, id: Date.now(), original_id: item.id }]);
            };

            const checkout = async () => {
                if(!cart.length) return;
                setLoading(true);
                const total = cart.reduce((a,b)=>a+b.price, 0);
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: total }]).select().single();
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: (t.stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                }
                window.print(); window.location.reload();
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="glass w-full max-w-md p-14 text-center">
                        <div className="w-24 h-24 bg-white/5 rounded-[2.5rem] mx-auto mb-10 flex items-center justify-center text-5xl font-black italic shadow-inner border border-white/10">D</div>
                        <h1 className="text-4xl font-black mb-12 tracking-widest italic text-white/80">DREAM SYSTEMS</h1>
                        <input className="text-center text-2xl w-full mb-6" placeholder="DRM-XXXX" id="lic" />
                        <button onClick={async ()=>{
                            const val = document.getElementById('lic').value.toUpperCase();
                            const {data} = await client.from('tenants').select('*').eq('license_key', val).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); } else alert("الكود غير موجود");
                        }} className="w-full py-5 bg-indigo-600 rounded-3xl font-black text-xl shadow-lg hover:bg-indigo-500 transition-all">دخول آمن 🚀</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-6 flex justify-between items-center sticky top-0 z-50 no-print">
                        <div className="flex flex-col">
                            <h1 className="font-black text-2xl italic tracking-tighter uppercase" style={{color: 'var(--accent)'}}>{tenant.business_name}</h1>
                            <span className="text-[9px] font-black opacity-30 uppercase tracking-[0.5em] mt-1">Cloud Terminal Active</span>
                        </div>
                        <div className="flex bg-white/5 backdrop-blur-md p-1.5 rounded-3xl gap-1">
                            {['pos', 'inventory', 'reports'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-6 py-3 rounded-2xl font-black text-[11px] uppercase transition-all ${view===v?'tab-active':'opacity-40 hover:opacity-100'}`}>
                                    {v==='pos'?'البيع':v==='inventory'?'المخزن والمنيو':'التقارير'}
                                </button>
                            ))}
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-4 text-rose-500 font-black">✕</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-[1600px] mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_420px] gap-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(item => (
                                        <div key={item.id} className="glass p-8 cursor-pointer group hover:scale-[1.03] transition-all" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'قطعة')}>
                                            <div className="flex justify-between items-start mb-6">
                                                <span className="text-[10px] font-black px-3 py-1 rounded-full bg-white/10 tracking-widest uppercase">{item.category}</span>
                                                <div className="font-black text-xl" style={{color: 'var(--accent)'}}>{item.price.toLocaleString()}</div>
                                            </div>
                                            <h3 className="font-bold text-2xl mb-6">{item.name}</h3>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-4 gap-2">
                                                    {[1, 0.5, 0.25].map(w => (
                                                        <button key={w} onClick={(e)=>{e.stopPropagation(); addToCart(item, w, w+' كغم')}} className="bg-white/5 hover:bg-white/20 py-3 rounded-xl text-[11px] font-black">{w}ك</button>
                                                    ))}
                                                    <button onClick={(e)=>{e.stopPropagation(); const p=prompt('ادخل المبلغ:'); if(p) addToCart(item, p, p+' د.ع', true)}} className="bg-white/10 py-3 rounded-xl text-[11px] font-black">💰</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="glass h-[82vh] flex flex-col sticky top-28 overflow-hidden">
                                    <div className="p-6 bg-white/[0.02] border-b border-white/10 font-black text-center text-xs tracking-widest opacity-40 uppercase">Checkout Bag</div>
                                    <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex justify-between items-center border-b border-white/5 pb-4">
                                                <div><p className="font-bold text-lg">{c.name}</p><small className="font-bold uppercase opacity-30 text-[10px]">{c.cart_label}</small></div>
                                                <div className="flex items-center gap-5">
                                                    <span className="font-black text-xl">{c.price.toLocaleString()}</span>
                                                    <button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-10 bg-white/[0.02] border-t border-white/10">
                                        <div className="flex justify-between items-end mb-10">
                                            <span className="text-[10px] font-black opacity-30 uppercase tracking-[0.5em]">Total Amount</span>
                                            <span className="text-6xl font-black tracking-tighter" style={{color: 'var(--accent)'}}>{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span>
                                        </div>
                                        <button onClick={checkout} disabled={loading} className="w-full py-8 bg-white/5 hover:bg-white/10 rounded-[3rem] font-black text-2xl uppercase border border-white/10">
                                            {loading ? 'Processing...' : 'Complete Sale ✅'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="glass p-10 animate-in fade-in zoom-in duration-500">
                                <h2 className="text-3xl font-black mb-12 italic uppercase" style={{color: 'var(--accent)'}}>إدارة المواد والمخزن</h2>
                                <div className="grid grid-cols-1 md:grid-cols-5 gap-6 mb-16 bg-white/5 p-8 rounded-[2.5rem]">
                                    <input placeholder="اسم المادة" id="nn" />
                                    <input placeholder="القسم" id="cc" />
                                    <input type="number" placeholder="سعر البيع" id="pp" />
                                    <select id="uu"><option value="piece">بالقطعة</option><option value="kg">بالكيلو</option></select>
                                    <button onClick={async ()=>{
                                        const n=document.getElementById('nn').value, p=document.getElementById('pp').value, c=document.getElementById('cc').value, u=document.getElementById('uu').value;
                                        if(n&&p) { 
                                            await client.from('products').insert([{name:n, price:parseFloat(p), category:c||'عام', unit_type:u, tenant_id:tenant.id}]); 
                                            loadData(); alert("تم الحفظ"); 
                                        }
                                    }} className="py-4 bg-indigo-600 rounded-2xl font-black">إضافة مادة ✨</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(i => (
                                        <div key={i.id} className="glass p-6 flex flex-col gap-4">
                                            <div className="flex justify-between items-center">
                                                <div><b className="text-xl">{i.name}</b><p className="text-xs opacity-40">المخزون: {i.stock_quantity.toFixed(2)}</p></div>
                                                <button onClick={async()=> {if(confirm('حذف؟')){await client.from('products').delete().eq('id',i.id); loadData();}}} className="text-rose-500 font-black">✕</button>
                                            </div>
                                            {/* واجهة التوريد الداخلية بدلاً من Prompt */}
                                            <div className="flex gap-2">
                                                <input type="number" placeholder="كمية مجهزة" className="!p-2 !text-xs !rounded-lg !w-24" id={`stock-${i.id}`} />
                                                <button onClick={async ()=>{
                                                    const val = document.getElementById(`stock-${i.id}`).value;
                                                    if(val) {
                                                        await client.from('products').update({stock_quantity: i.stock_quantity + parseFloat(val)}).eq('id', i.id);
                                                        document.getElementById(`stock-${i.id}`).value = '';
                                                        loadData();
                                                    }
                                                }} className="bg-white/10 px-4 py-2 rounded-lg text-xs font-black hover:bg-white/20">تجهيز واصل (+)</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="space-y-10">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="glass p-12 text-center stat-animate" style={{borderColor: 'var(--accent)'}}>
                                        <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">مبيعات اليوم</p>
                                        <h2 className="text-6xl font-black tracking-tighter"><AnimatedNumber value={stats.sales} /></h2>
                                    </div>
                                    <div className="glass p-12 text-center border-rose-500/20 stat-animate">
                                        <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">المسحوبات</p>
                                        <h2 className="text-6xl font-black tracking-tighter text-rose-500"><AnimatedNumber value={stats.expenses} /></h2>
                                    </div>
                                    <div className="glass p-12 text-center stat-animate">
                                        <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">الصافي</p>
                                        <h2 className="text-6xl font-black tracking-tighter text-emerald-500"><AnimatedNumber value={stats.sales - stats.expenses} /></h2>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
