<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Universal Cloud POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --accent: #6366f1; --bg-img: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop'); }
        [data-theme='food'] { --accent: #ea580c; --bg-img: url('https://images.unsplash.com/photo-1550503990-bcff333d837a?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='retail'] { --accent: #059669; --bg-img: url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='auto'] { --accent: #ca8a04; --bg-img: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?q=80&w=2000&auto=format&fit=crop'); }

        body { background-color: #020617; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .dynamic-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(2, 6, 23, 0.9), rgba(2, 6, 23, 0.95)), var(--bg-img); background-size: cover; background-position: center; z-index: -2; transition: 1s; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(40px) saturate(120%); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 40px; }
        input, select { background: rgba(255, 255, 255, 0.95) !important; color: #000 !important; font-weight: 900 !important; border-radius: 18px !important; padding: 12px !important; border: none !important; width: 100%; outline: none; }
        .tab-active { background: var(--accent) !important; color: white !important; box-shadow: 0 0 25px var(--accent); }
        @media print { .no-print { display: none; } #print-area { display: block !important; width: 80mm; background: white; color: black; padding: 5mm; } }
    </style>
</head>
<body id="body-tag">
    <div class="dynamic-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        const Counter = ({ value }) => {
            const [num, setNum] = useState(0);
            useEffect(() => {
                let start = 0;
                const end = parseInt(value);
                const timer = setInterval(() => {
                    start += Math.ceil(end / 20);
                    if (start >= end) { setNum(end); clearInterval(timer); }
                    else setNum(start);
                }, 30);
                return () => clearInterval(timer);
            }, [value]);
            return <span>{num.toLocaleString()}</span>;
        };

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0 });
            const [bcSearch, setBcSearch] = useState('');
            const [newItem, setNewItem] = useState({ id: null, name: '', price: '', category: 'عام', unit: 'piece', barcode: '', cost: '' });
            const [loading, setLoading] = useState(false);

            const searchRef = useRef(null);
            const invBarcodeRef = useRef(null);

            // تحديد الوحدة بناءً على نوع النشاط
            const unitLabel = tenant?.business_type === 'auto' ? 'لتر' : 'كيلو';
            const shortUnit = tenant?.business_type === 'auto' ? 'لـ' : 'ك';

            useEffect(() => {
                if (tenant) {
                    document.getElementById('body-tag').setAttribute('data-theme', tenant.business_type);
                    loadData(); loadStats();
                }
            }, [tenant]);

            useEffect(() => {
                if(view === 'pos' && searchRef.current) searchRef.current.focus();
                if(view === 'inventory' && invBarcodeRef.current) invBarcodeRef.current.focus();
            }, [view]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('total_amount').eq('tenant_id', tenant.id).gte('created_at', today);
                const { data: e } = await client.from('expenses').select('amount').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ sales: s?.reduce((a,b)=>a+b.total_amount, 0)||0, expenses: e?.reduce((a,b)=>a+b.amount, 0)||0 });
            }

            const handleInventoryBarcode = (code) => {
                const existing = items.find(i => i.barcode === code.trim());
                if (existing) {
                    setNewItem({ id: existing.id, name: existing.name, price: existing.price, category: existing.category, unit: existing.unit_type, barcode: existing.barcode, cost: existing.cost_price });
                } else {
                    setNewItem({ ...newItem, barcode: code, id: null });
                }
            };

            const saveProduct = async () => {
                if(!newItem.name || !newItem.price) return alert("اكمل البيانات");
                const payload = { name: newItem.name, price: parseFloat(newItem.price), cost_price: parseFloat(newItem.cost || 0), category: newItem.category, unit_type: newItem.unit, barcode: newItem.barcode, tenant_id: tenant.id };
                if (newItem.id) {
                    await client.from('products').update(payload).eq('id', newItem.id);
                    const restock = prompt(`المادة موجودة، أضف كمية (${unitLabel}) جديدة؟ (أو اترك فارغاً لتعديل السعر فقط)`);
                    if(restock) {
                        const val = parseFloat(restock);
                        const isCash = confirm("هل المبلغ واصل كاش؟");
                        const target = items.find(i => i.id === newItem.id);
                        await client.from('products').update({stock_quantity: target.stock_quantity + val}).eq('id', newItem.id);
                        if(isCash) await client.from('expenses').insert([{tenant_id:tenant.id, amount: val * payload.cost_price, reason: `تجهيز: ${payload.name}`}]);
                    }
                } else {
                    await client.from('products').insert([payload]);
                }
                setNewItem({ id: null, name: '', price: '', category: 'عام', unit: 'piece', barcode: '', cost: '' });
                loadData(); loadStats();
            };

            const addToCart = (item, qty, label, isPrice = false) => {
                let fQty = isPrice ? parseFloat(qty)/item.price : qty;
                let fPrice = isPrice ? parseFloat(qty) : item.price * qty;
                setCart(prev => [...prev, { ...item, cart_qty: fQty, price: fPrice, cart_label: label, id: Date.now(), original_id: item.id }]);
            };

            const checkout = async () => {
                if(!cart.length) return;
                const total = cart.reduce((a,b)=>a+b.price, 0);
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: total }]).select().single();
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: (t.stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                }
                window.print(); window.location.reload();
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass w-full max-w-lg p-16 text-center animate-in zoom-in duration-500">
                        <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[2.5rem] mx-auto mb-10 flex items-center justify-center text-6xl font-black italic shadow-2xl">D</div>
                        <h1 className="text-4xl font-black mb-12 italic tracking-widest text-white">DREAM SYSTEMS</h1>
                        <input className="text-center text-2xl !p-5 mb-6" placeholder="DRM-XXXX" id="lic" />
                        <button onClick={async ()=>{
                            const val = document.getElementById('lic').value.toUpperCase();
                            const {data} = await client.from('tenants').select('*').eq('license_key', val).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); window.location.reload(); } else alert("الكود خطأ");
                        }} className="w-full py-5 bg-indigo-600 rounded-3xl font-black text-xl">دخول للنظام</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-6 flex justify-between items-center sticky top-0 z-50 no-print">
                        <div className="flex flex-col">
                            <h1 className="font-black text-2xl italic tracking-tighter uppercase" style={{color: 'var(--accent)'}}>{tenant.business_name}</h1>
                            <span className="text-[10px] font-black opacity-30 uppercase tracking-[0.5em]">Terminal Active</span>
                        </div>
                        <div className="flex bg-white/5 backdrop-blur-md p-1.5 rounded-3xl gap-1 no-print">
                            <button onClick={()=>setView('pos')} className={`px-6 py-3 rounded-2xl font-black text-[11px] transition-all ${view===v?'tab-active':'opacity-40'}`}>البيع</button>
                            <button onClick={()=>setView('inventory')} className={`px-6 py-3 rounded-2xl font-black text-[11px] transition-all ${view==='inventory'?'tab-active':'opacity-40'}`}>المخزن</button>
                            <button onClick={()=>setView('reports')} className={`px-6 py-3 rounded-2xl font-black text-[11px] transition-all ${view==='reports'?'tab-active':'opacity-40'}`}>التقارير</button>
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-4 text-rose-500 font-black">✕</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-[1600px] mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="space-y-6">
                                <div className="flex justify-center mb-8">
                                    <input 
                                        ref={searchRef}
                                        value={bcSearch}
                                        onChange={(e)=>{
                                            setBcSearch(e.target.value);
                                            const prod = items.find(i=>i.barcode === e.target.value.trim());
                                            if(prod) { addToCart(prod, 1, 'سكنر'); setBcSearch(''); }
                                        }}
                                        className="!w-full max-w-md !bg-white border-4 border-indigo-500/20 !text-xl text-center" 
                                        placeholder="امسح الباركود للبيع الفوري..." 
                                    />
                                </div>
                                <div className="grid lg:grid-cols-[1fr_420px] gap-10">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 h-fit">
                                        {items.map(item => (
                                            <div key={item.id} className="glass p-8 cursor-pointer group transition-all" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'قطعة')}>
                                                <div className="flex justify-between items-start mb-6">
                                                    <span className="text-[10px] font-black px-3 py-1 rounded-full bg-white/10 opacity-60 uppercase">{item.category}</span>
                                                    <div className="font-black text-xl" style={{color: 'var(--accent)'}}>{item.price.toLocaleString()}</div>
                                                </div>
                                                <h3 className="font-bold text-2xl mb-6">{item.name}</h3>
                                                {item.unit_type === 'kg' && (
                                                    <div className="grid grid-cols-4 gap-2">
                                                        {[1, 0.5, 0.25].map(w => (
                                                            <button key={w} onClick={(e)=>{e.stopPropagation(); addToCart(item, w, w+' '+unitLabel)}} className="bg-white/5 hover:bg-white/20 py-3 rounded-xl text-[11px] font-black">{w}{shortUnit}</button>
                                                        ))}
                                                        <button onClick={(e)=>{e.stopPropagation(); const p=prompt('المبلغ:'); if(p) addToCart(item, p, p+' د.ع', true)}} className="bg-white/10 py-3 rounded-xl text-[11px] font-black">💰</button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="glass h-[82vh] flex flex-col sticky top-28 overflow-hidden bg-slate-900/50">
                                        <div className="p-6 bg-white/[0.02] border-b border-white/10 font-black text-center text-xs opacity-40 uppercase">Checkout</div>
                                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                            {cart.map((c, i) => (
                                                <div key={i} className="flex justify-between items-center border-b border-white/5 pb-4">
                                                    <div><p className="font-bold text-lg">{c.name}</p><small className="font-bold opacity-30 text-[10px] uppercase">{c.cart_label}</small></div>
                                                    <div className="flex items-center gap-5">
                                                        <span className="font-black text-xl">{c.price.toLocaleString()}</span>
                                                        <button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500">✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="p-10 bg-white/[0.02] border-t border-white/10">
                                            <div className="flex justify-between items-end mb-10 text-3xl font-black">
                                                <span className="text-[10px] opacity-30 uppercase tracking-[0.5em]">Total</span>
                                                <span style={{color: 'var(--accent)'}}>{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span>
                                            </div>
                                            <button onClick={checkout} className="w-full py-8 bg-indigo-600 rounded-[3rem] font-black text-2xl uppercase">تأكيد وطباعة ✅</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="glass p-10 animate-in fade-in zoom-in duration-500">
                                <h2 className="text-3xl font-black mb-12 italic uppercase" style={{color: 'var(--accent)'}}>إدارة المواد والباركود</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-16 bg-white/5 p-8 rounded-3xl border border-white/10">
                                    <input ref={invBarcodeRef} placeholder="باركود (سكنر)" value={newItem.barcode} onChange={e => handleInventoryBarcode(e.target.value)} className="!bg-slate-800 !text-white" />
                                    <input placeholder="اسم المادة" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} />
                                    <input placeholder="القسم" value={newItem.category} onChange={e=>setNewItem({...newItem, category:e.target.value})} />
                                    <input type="number" placeholder="سعر البيع" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} />
                                    <input type="number" placeholder="سعر التكلفة" value={newItem.cost} onChange={e=>setNewItem({...newItem, cost:e.target.value})} />
                                    <select value={newItem.unit} onChange={e=>setNewItem({...newItem, unit:e.target.value})}>
                                        <option value="piece">بالقطعة</option>
                                        <option value="kg">بالـ {unitLabel}</option>
                                    </select>
                                    <button onClick={saveProduct} className="lg:col-span-6 py-4 bg-indigo-600 rounded-xl font-black">حفظ المادة ✨</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(i => (
                                        <div key={i.id} className="glass p-6 flex flex-col gap-4">
                                            <div className="flex justify-between items-center">
                                                <div><b className="text-xl">{i.name}</b><p className="text-xs opacity-40">باركود: {i.barcode || 'N/A'}</p></div>
                                                <span className="text-xs font-black px-3 py-1 rounded-lg bg-emerald-500/10 text-emerald-500">{i.stock_quantity.toFixed(2)} {i.unit_type === 'kg' ? unitLabel : 'قطعة'}</span>
                                            </div>
                                            <div className="flex gap-2">
                                                <input type="number" placeholder="تجهيز" className="!p-2 !text-xs !bg-white/5 !text-white !w-24 rounded-lg" id={`inv-${i.id}`} />
                                                <button onClick={async ()=>{
                                                    const val = parseFloat(document.getElementById(`inv-${i.id}`).value);
                                                    if(!val) return;
                                                    const isCash = confirm(`هل تم دفع ثمن البضاعة (${val} ${unitLabel}) من الكاش؟`);
                                                    await client.from('products').update({stock_quantity: i.stock_quantity + val}).eq('id', i.id);
                                                    if(isCash) await client.from('expenses').insert([{tenant_id:tenant.id, amount: val * (i.cost_price || 0), reason: `تجهيز: ${i.name}`}]);
                                                    document.getElementById(`inv-${i.id}`).value = '';
                                                    loadData(); loadStats();
                                                }} className="bg-indigo-600/20 text-indigo-400 px-4 py-2 rounded-xl text-xs font-black flex-1">إضافة (+)</button>
                                                <button onClick={async()=> {if(confirm('حذف؟')){await client.from('products').delete().eq('id',i.id); loadData();}}} className="text-rose-500 px-4">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="glass p-12 text-center border-indigo-500/10">
                                    <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">مبيعات اليوم</p>
                                    <h2 className="text-6xl font-black tracking-tighter" style={{color: 'var(--accent)'}}><Counter value={stats.sales} /></h2>
                                </div>
                                <div className="glass p-12 text-center border-rose-500/10">
                                    <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">المسحوبات</p>
                                    <h2 className="text-6xl font-black tracking-tighter text-rose-500"><Counter value={stats.expenses} /></h2>
                                </div>
                                <div className="glass p-12 text-center">
                                    <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">الصافي</p>
                                    <h2 className="text-6xl font-black tracking-tighter text-emerald-500"><Counter value={stats.sales - stats.expenses} /></h2>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-10 text-center opacity-10 text-[9px] font-black uppercase tracking-[1em]">Dream Systems Universal Node</footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
