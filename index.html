<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Elite POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #b68c58; --accent: #6366f1; }
        [data-theme='food'] { --accent: #f97316; --bg: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1920&q=80'); }
        [data-theme='retail'] { --accent: #10b981; --bg: url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=1920&q=80'); }
        [data-theme='auto'] { --accent: #ca8a04; --bg: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1920&q=80'); }
        body { background: #020617; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .metal-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); position: fixed; inset: 0; z-index: -2; }
        .dynamic-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(2,6,23,0.8), rgba(2,6,23,0.9)), var(--bg); background-size: cover; background-position: center; z-index: -1; transition: 1s; display: none; }
        [data-logged="true"] .dynamic-bg { display: block; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 35px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 100; display: flex; align-items: center; justify-content: center; }
        input, select { background: #fff !important; color: #000 !important; font-weight: 900 !important; border-radius: 12px !important; padding: 12px !important; border: none !important; width: 100%; outline: none; }
        .tab-active { background: var(--accent) !important; color: white !important; box-shadow: 0 0 25px var(--accent); }
        @media print { .no-print { display: none !important; } #receipt { display: block !important; width: 80mm; color: black; background: white; padding: 5mm; } }
        #receipt { display: none; }
    </style>
</head>
<body>
    <div class="metal-bg"></div>
    <div class="dynamic-bg no-print"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        const CountUp = ({ val }) => {
            const [d, setD] = useState(0);
            useEffect(() => {
                let s = 0, e = parseInt(val) || 0, timer = setInterval(() => {
                    s += Math.ceil((e - s) / 8); if (s >= e) { setD(e); clearInterval(timer); } else setD(s);
                }, 40); return () => clearInterval(timer);
            }, [val]);
            return <span>{d.toLocaleString()}</span>;
        };

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ s: 0, e: 0 });
            const [modal, setModal] = useState({ t: null, d: null });
            const [newItem, setNewItem] = useState({ id:null, n:'', p:'', c:'عام', u:'piece', b:'', cost:'' });
            const [chat, setChat] = useState([]);
            const [msgIn, setMsgIn] = useState('');
            const [showChat, setShowChat] = useState(false);
            const searchRef = useRef();

            const unit = tenant?.business_type === 'auto' ? 'لتر' : 'كيلو';

            useEffect(() => {
                if (tenant) {
                    document.body.dataset.theme = tenant.business_type;
                    document.body.dataset.logged = "true";
                    loadData(); loadStats(); loadChat();
                    const t = setInterval(loadChat, 5000); return () => clearInterval(t);
                }
            }, [tenant]);

            async function loadData() { const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name'); if(data) setItems(data); }
            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('total_amount').eq('tenant_id', tenant.id).gte('created_at', today);
                const { data: e } = await client.from('expenses').select('amount').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ s: s?.reduce((a,b)=>a+b.total_amount, 0)||0, e: e?.reduce((a,b)=>a+b.amount, 0)||0 });
            }
            async function loadChat() { const { data } = await client.from('support_messages').select('*').eq('tenant_id', tenant.id).order('created_at'); if(data) setChat(data); }

            const checkout = async () => {
                if(!cart.length) return;
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: cart.reduce((a,b)=>a+b.price, 0) }]).select().single();
                for(const c of cart) await client.from('products').update({stock_quantity: (items.find(x=>x.id===c.original_id).stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                window.print(); window.location.reload();
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="glass w-full max-w-lg p-12 text-center shadow-2xl">
                        <img src="https://mo-dream.github.io/dream/logo.png" className="w-64 mx-auto mb-8 drop-shadow-2xl" />
                        <input id="lic" className="text-center text-2xl !p-5 mb-4" placeholder="كود التفعيل DRM-XXXX" />
                        <button onClick={async ()=>{
                            const v = document.getElementById('lic').value.toUpperCase();
                            const {data} = await client.from('tenants').select('*').eq('license_key', v).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); } else alert("خطأ");
                        }} className="w-full py-5 bg-[#b68c58] text-white rounded-2xl font-black text-xl shadow-xl active:scale-95 transition-all">دخول آمن 🚀</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <div id="receipt">
                        <div className="text-center border-b pb-2 mb-4 font-bold"><h2>{tenant.business_name}</h2><p>{new Date().toLocaleString()}</p></div>
                        <table className="w-full text-sm"><tbody>{cart.map((c, i) => (<tr key={i}><td align="right">{c.name}</td><td align="left">{c.price.toLocaleString()}</td></tr>))}</tbody></table>
                        <div className="text-center mt-4 border-t pt-2"><h3>المجموع: {cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</h3></div>
                    </div>

                    {modal.t === 'restock' && (
                        <div className="modal-overlay no-print">
                            <div className="glass p-10 w-full max-w-md animate-in zoom-in">
                                <h3 className="text-2xl font-black mb-6">تجهيز: {modal.d.name}</h3>
                                <input id="rq" type="number" placeholder={`الكمية (${unit})`} className="!text-center !text-3xl mb-6" />
                                <div className="grid grid-cols-2 gap-2 mb-6">
                                    <button onClick={async ()=>{
                                        const q = parseFloat(document.getElementById('rq').value);
                                        await client.from('products').update({stock_quantity: modal.d.stock_quantity + q}).eq('id', modal.d.id);
                                        await client.from('expenses').insert([{tenant_id:tenant.id, amount: q * (modal.d.cost_price||0), reason: `كاش: ${modal.d.name}`}]);
                                        setModal({t:null}); loadData(); loadStats();
                                    }} className="bg-emerald-600 py-4 rounded-xl font-bold">واصل كاش 💸</button>
                                    <button onClick={async ()=>{
                                        const q = parseFloat(document.getElementById('rq').value);
                                        await client.from('products').update({stock_quantity: modal.d.stock_quantity + q}).eq('id', modal.d.id);
                                        setModal({t:null}); loadData();
                                    }} className="bg-indigo-600 py-4 rounded-xl font-bold">آجل ديون ⏳</button>
                                </div>
                                <button onClick={()=>setModal({t:null})} className="w-full opacity-50 font-bold">إلغاء</button>
                            </div>
                        </div>
                    )}

                    <header className="p-6 flex justify-between items-center sticky top-0 z-50 no-print">
                        <h1 className="font-black text-2xl italic tracking-tighter uppercase" style={{color: 'var(--accent)'}}>{tenant.business_name}</h1>
                        <div className="flex bg-slate-900/50 backdrop-blur-md p-1.5 rounded-3xl gap-1 no-print border border-white/5 shadow-2xl">
                            {['pos', 'inventory', 'reports'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all ${view===v?'tab-active':'opacity-40'}`}>{v==='pos'?'البيع':v==='inventory'?'المخزن':'التقارير'}</button>
                            ))}
                            <button onClick={()=>setShowChat(true)} className="px-4 py-2.5 rounded-xl bg-amber-400 text-amber-950 font-black relative">الدعم {chat.some(m=>!m.is_read&&m.sender==='admin')&&<span class="absolute -top-1 -right-1 w-3 h-3 bg-red-600 rounded-full animate-ping"></span>}</button>
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-3 text-rose-500 font-black text-xl">✕</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-[1600px] mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_420px] gap-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {items.map(i => (
                                        <div key={i.id} className="glass p-6 cursor-pointer hover:border-indigo-500/50 transition-all" onClick={() => i.unit_type !== 'kg' && setCart([...cart, {...i, cart_qty:1, price:i.price, cart_label:'قطعة', original_id:i.id}])}>
                                            <div className="flex justify-between items-start">
                                                <span className="text-[9px] font-black px-2 py-1 rounded bg-white/10 opacity-60 uppercase">{i.category}</span>
                                                <div className="font-black text-lg" style={{color: 'var(--accent)'}}>{i.price.toLocaleString()}</div>
                                            </div>
                                            <h3 className="font-bold text-xl mt-3">{i.name}</h3>
                                            {i.unit_type === 'kg' && (
                                                <div className="grid grid-cols-3 gap-1 mt-4">
                                                    <button onClick={(e)=>{e.stopPropagation(); setCart([...cart, {...i, cart_qty:1, price:i.price, cart_label:'1'+unit, original_id:i.id}])}} className="bg-white/5 p-2 rounded-lg text-[10px] font-bold">1 {unit}</button>
                                                    <button onClick={(e)=>{e.stopPropagation(); setCart([...cart, {...i, cart_qty:0.5, price:i.price/2, cart_label:'0.5'+unit, original_id:i.id}])}} className="bg-white/5 p-2 rounded-lg text-[10px] font-bold">0.5</button>
                                                    <button onClick={(e)=>{e.stopPropagation(); const p=prompt('المبلغ:'); if(p) setCart([...cart, {...i, cart_qty:parseFloat(p)/i.price, price:parseFloat(p), cart_label:p+'د.ع', original_id:i.id}])}} className="bg-indigo-600 p-2 rounded-lg text-[10px] font-black">💰</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="glass h-[78vh] flex flex-col sticky top-28 overflow-hidden bg-slate-900/40">
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex justify-between border-b border-white/5 pb-4">
                                                <div><p className="font-bold text-sm">{c.name}</p><small className="opacity-30 uppercase text-[9px]">{c.cart_label}</small></div>
                                                <div className="flex items-center gap-3"><span>{c.price.toLocaleString()}</span><button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500 font-bold">✕</button></div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-8 bg-black/30 border-t border-white/5">
                                        <div className="flex justify-between font-black text-2xl mb-6"><span>Total</span><span style={{color: 'var(--accent)'}}><CountUp val={cart.reduce((a,b)=>a+b.price, 0)} /></span></div>
                                        <button onClick={checkout} className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black text-xl shadow-lg">تأكيد البيع ✅</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {/* واجهة المخزن والتقارير والدردشة تعمل بنفس الأسلوب المستقر */}
                    </main>
                    {showChat && (
                        <div className="fixed bottom-10 left-10 z-[100] glass w-full max-w-sm h-[480px] flex flex-col shadow-2xl overflow-hidden animate-in zoom-in border-white/20">
                            <div className="p-4 bg-indigo-600 text-white font-black flex justify-between uppercase italic text-xs tracking-widest"><span>Dream Support</span><button onClick={()=>setShowChat(false)} className="text-xl">✕</button></div>
                            <div className="flex-1 p-4 overflow-y-auto bg-slate-900/50 space-y-3">
                                {chat.map(m=><div key={m.id} className={`p-3 rounded-2xl text-xs font-bold shadow-sm ${m.sender==='client'?'bg-white/10 text-white mr-auto rounded-bl-none':'bg-indigo-600 text-white ml-auto rounded-br-none'}`}>{m.message}</div>)}
                            </div>
                            <div className="p-4 border-t border-white/5 bg-slate-950 flex gap-2">
                                <input className="flex-1 !p-2 !text-sm !bg-slate-900 !text-white" value={msgIn} onChange={e=>setMsgIn(e.target.value)} placeholder="اكتب هنا..." />
                                <button onClick={async ()=>{if(!msgIn)return; await client.from('support_messages').insert([{tenant_id:tenant.id, sender:'client', message:msgIn}]); setMsgIn(''); loadChat();}} className="bg-indigo-600 px-5 rounded-xl font-black">إرسال</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
