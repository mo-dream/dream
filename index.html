<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems - Professional POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f8fafc;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><text x="50%" y="50%" font-size="40" font-weight="900" fill="rgba(79, 70, 229, 0.03)" font-family="Arial" text-anchor="middle" transform="rotate(-25 200 200)">DREAM SYSTEMS</text></svg>');
            background-attachment: fixed;
            color: #1e293b;
        }
        input, select, textarea { 
            border: 2px solid #e2e8f0 !important; padding: 12px; border-radius: 12px; font-weight: 700; outline: none; background: white !important; color: black !important;
        }
        input:focus { border-color: #4f46e5 !important; }
        .tab-active { background: #4f46e5 !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        .dream-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid #fff; }
        @media print { .no-print { display: none; } #print-area { display: block !important; width: 80mm; font-family: 'Arial'; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0, orders: [] });
            const [showChat, setShowChat] = useState(false);
            const [chat, setChat] = useState([]);
            const [msgInput, setMsgInput] = useState('');
            const [licenseInput, setLicenseInput] = useState('');

            // بيانات فورم الإضافة الجديد
            const [newItem, setNewItem] = useState({ name: '', price: '', category: '', unit: 'piece', cost: '' });

            useEffect(() => {
                if (tenant) {
                    const checkAuth = async () => {
                        const { data } = await client.from('tenants').select('id').eq('id', tenant.id).maybeSingle();
                        if (!data) { logout(); } else { loadData(); loadStats(); loadChat(); }
                    };
                    checkAuth();
                }
            }, [tenant]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('*, order_items(*)').eq('tenant_id', tenant.id).gte('created_at', today).order('created_at', {ascending: false});
                const { data: e } = await client.from('expenses').select('*').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ sales: s?.reduce((a,b)=>a+b.total_amount, 0)||0, expenses: e?.reduce((a,b)=>a+b.amount, 0)||0, orders: s || [] });
            }

            async function loadChat() {
                const { data } = await client.from('support_messages').select('*').eq('tenant_id', tenant.id).order('created_at');
                if(data) setChat(data);
            }

            const logout = () => { localStorage.removeItem('dream_session'); setTenant(null); window.location.reload(); };

            const addToCart = (item, qty, label) => {
                setCart([...cart, { ...item, cart_qty: qty, price: item.price * qty, cart_label: label, note: '', id: Date.now(), original_id: item.id }]);
            };

            const checkout = async () => {
                if(!cart.length) return;
                const total = cart.reduce((a,b)=>a+b.price, 0);
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: total }]).select().single();
                
                const orderItems = cart.map(c => ({ order_id: order.id, product_name: c.name, qty: c.cart_qty, price: c.price, item_note: c.note }));
                await client.from('order_items').insert(orderItems);
                
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: t.stock_quantity - c.cart_qty}).eq('id', c.original_id);
                }
                window.print(); window.location.reload();
            };

            // وظيفة إضافة مادة جديدة (منيو + مخزون)
            const handleAddItem = async () => {
                if(!newItem.name || !newItem.price) return alert("املاً الاسم والسعر");
                const { error } = await client.from('products').insert([{
                    name: newItem.name,
                    price: parseFloat(newItem.price),
                    cost_price: parseFloat(newItem.cost || 0),
                    category: newItem.category || 'عام',
                    unit_type: newItem.unit,
                    tenant_id: tenant.id,
                    stock_quantity: 0
                }]);
                if(!error) { alert("تمت الإضافة!"); setNewItem({ name: '', price: '', category: '', unit: 'piece', cost: '' }); loadData(); }
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 text-white text-center">
                    <div className="w-full max-w-sm">
                        <h1 className="text-4xl font-black mb-10 italic">DREAM SYSTEMS</h1>
                        <input className="mb-4 text-center text-2xl !p-5 w-full" placeholder="DRM-XXXX" onChange={e=>setLicenseInput(e.target.value.toUpperCase())} />
                        <button onClick={async ()=>{
                            const {data} = await client.from('tenants').select('*').eq('license_key', licenseInput).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); } else alert("الكود خطأ");
                        }} className="w-full py-5 bg-indigo-600 rounded-2xl font-black text-xl">تنشيط النظام 🚀</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* الفاتورة للطباعة */}
                    <div id="print-area" className="hidden p-4">
                        <div style={{textAlign: 'center', borderBottom: '1px dashed black', paddingBottom: '10px', marginBottom: '10px'}}>
                            <h2 style={{fontSize: '20px'}}>{tenant.business_name}</h2>
                            <p>هاتف: {tenant.phone_number || '--'}</p>
                        </div>
                        <table style={{width: '100%', fontSize: '14px'}}>
                            {cart.map((c, i) => (
                                <tr key={i}><td align="right">{c.name}</td><td align="left">{c.price.toLocaleString()}</td></tr>
                            ))}
                        </table>
                        <div style={{textAlign: 'center', borderTop: '2px solid black', marginTop: '10px', paddingTop: '10px'}}>
                            <h3>المجموع: {cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</h3>
                        </div>
                    </div>

                    <header className="bg-white/80 backdrop-blur-md p-4 border-b flex justify-between items-center sticky top-0 z-40 no-print">
                        <div className="flex items-center gap-3">
                            <h1 className="font-black text-2xl text-slate-800">{tenant.business_name}</h1>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl gap-1 text-[10px] md:text-xs">
                            {['pos', 'inventory', 'reports'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-5 py-2 rounded-lg font-black transition-all ${view===v?'tab-active':'text-slate-500'}`}>
                                    {v==='pos'?'البيع':v==='inventory'?'المنيو والمخزن':'التقارير'}
                                </button>
                            ))}
                            <button onClick={()=>setShowChat(true)} className="px-5 py-2 rounded-lg font-black bg-yellow-400 relative">
                                الدعم الفني
                                {chat.some(m=>!m.is_read && m.sender==='admin') && <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-600 rounded-full"></span>}
                            </button>
                            <button onClick={logout} className="px-5 py-2 text-red-500 font-bold">خروج</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-6 max-w-7xl mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_380px] gap-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {items.map(item => (
                                        <div key={item.id} className="dream-card p-5 cursor-pointer hover:border-indigo-400 border-2 border-transparent transition-all" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'قطعة')}>
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <span className="text-[10px] font-black text-indigo-500 bg-indigo-50 px-2 py-1 rounded">{item.category}</span>
                                                    <h3 className="font-black text-xl text-slate-800 mt-2">{item.name}</h3>
                                                </div>
                                                <div className="font-black text-indigo-600 text-lg">{item.price.toLocaleString()}</div>
                                            </div>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-3 gap-2 mt-4">
                                                    <button onClick={(e)=>{e.stopPropagation(); addToCart(item, 1, '1 كغم')}} className="p-2 border-2 rounded-xl text-xs font-black">1 كغم</button>
                                                    <button onClick={(e)=>{e.stopPropagation(); addToCart(item, 0.5, 'نصف كغم')}} className="p-2 border-2 rounded-xl text-xs font-black">نصف</button>
                                                    <button onClick={(e)=>{e.stopPropagation(); const a=prompt("أدخل السعر المخصص:"); if(a) addToCart(item, parseFloat(a)/item.price, `${a} د.ع`)}} className="p-2 bg-yellow-400 rounded-xl text-xs font-black">مخصص</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {items.length === 0 && <div className="col-span-full py-20 text-center opacity-30 italic">أضف مواد من صفحة المنيو للبدء</div>}
                                </div>
                                
                                <div className="card h-[80vh] flex flex-col sticky top-24 border-2 border-indigo-100 shadow-2xl overflow-hidden bg-white">
                                    <div className="p-4 bg-slate-900 text-white font-black text-center">الفاتورة</div>
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex flex-col border-b pb-3">
                                                <div className="flex justify-between items-center">
                                                    <div><p className="font-black">{c.name}</p><small className="text-indigo-500">{c.cart_label}</small></div>
                                                    <div className="flex items-center gap-3 font-black"><span>{c.price.toLocaleString()}</span><button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-red-400 font-black">✕</button></div>
                                                </div>
                                                <input className="!p-1 text-[10px] mt-2" placeholder="ملاحظة للصنف..." value={c.note} onChange={e=>{
                                                    const n = [...cart]; n[i].note = e.target.value; setCart(n);
                                                }} />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-6 bg-slate-50 border-t">
                                        <div className="flex justify-between font-black text-2xl mb-4"><span>المجموع</span><span>{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span></div>
                                        <button onClick={checkout} className="w-full py-5 bg-indigo-600 text-white rounded-[2rem] font-black text-xl">تأكيد وطباعة ✅</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="space-y-6">
                                <div className="dream-card p-8">
                                    <h2 className="text-2xl font-black mb-6 italic">📦 إدارة المنيو والمخزون</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-10">
                                        <input placeholder="اسم المادة" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} />
                                        <input placeholder="القسم (لحوم، مشروبات...)" value={newItem.category} onChange={e=>setNewItem({...newItem, category:e.target.value})} />
                                        <input type="number" placeholder="سعر البيع" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} />
                                        <input type="number" placeholder="سعر التكلفة" value={newItem.cost} onChange={e=>setNewItem({...newItem, cost:e.target.value})} />
                                        <select value={newItem.unit} onChange={e=>setNewItem({...newItem, unit:e.target.value})}>
                                            <option value="piece">بالقطعة</option>
                                            <option value="kg">بالكيلو</option>
                                        </select>
                                        <button onClick={handleAddItem} className="bg-indigo-600 text-white py-4 rounded-xl font-black">إضافة المادة ✨</button>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-right border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 text-[10px] font-black">
                                                    <th className="p-4">المادة</th>
                                                    <th className="p-4 text-center">المخزون</th>
                                                    <th className="p-4 text-center">التحكم</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {items.map(i => (
                                                    <tr key={i.id} className="border-b font-bold">
                                                        <td className="p-4">{i.name} <br/><small className="text-indigo-400">{i.category}</small></td>
                                                        <td className="p-4 text-center">
                                                            <span className={`px-3 py-1 rounded-full text-xs ${i.stock_quantity<=0?'bg-red-50 text-red-500':'bg-green-50 text-green-500'}`}>{i.stock_quantity.toFixed(2)}</span>
                                                        </td>
                                                        <td className="p-4 text-center space-x-2 space-x-reverse">
                                                            <button onClick={async ()=>{
                                                                const q = prompt("الكمية المجهزة الجديدة:");
                                                                if(q) {
                                                                    await client.from('products').update({stock_quantity: i.stock_quantity + parseFloat(q)}).eq('id', i.id);
                                                                    loadData();
                                                                }
                                                            }} className="bg-indigo-600 text-white px-4 py-1 rounded-lg text-xs">تجهيز (+)</button>
                                                            <button onClick={async()=>{if(confirm('حذف نهائي؟')){await client.from('products').delete().eq('id',i.id); loadData()}}} className="text-red-500">حذف</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="dream-card p-8 bg-indigo-600 text-white text-center">
                                    <p className="text-xs font-black opacity-60">مبيعات اليوم</p>
                                    <h2 className="text-4xl font-black mt-2">{stats.sales.toLocaleString()}</h2>
                                </div>
                                <div className="dream-card p-8 bg-slate-900 text-white text-center">
                                    <p className="text-xs font-black opacity-60">عدد الطلبات</p>
                                    <h2 className="text-4xl font-black mt-2">{stats.orders.length}</h2>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* نافذة الدعم الفني */}
                    {showChat && (
                        <div className="fixed bottom-10 left-10 z-[100] dream-card w-full max-w-sm h-[500px] flex flex-col shadow-2xl border-2 border-indigo-500 overflow-hidden">
                            <div className="p-4 bg-indigo-600 text-white font-black flex justify-between">
                                <span>مركز الدعم - Dream Systems</span>
                                <button onClick={()=>setShowChat(false)}>✕</button>
                            </div>
                            <div className="flex-1 p-4 overflow-y-auto bg-slate-50 space-y-3">
                                {chat.map(m => (
                                    <div key={m.id} className={`max-w-[80%] p-3 rounded-2xl text-sm ${m.sender==='client'?'bg-white mr-auto text-slate-800 shadow-sm':'bg-indigo-600 ml-auto text-white'}`}>
                                        {m.message}
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 border-t flex gap-2 bg-white">
                                <input className="flex-1" value={msgInput} onChange={e=>setMsgInput(e.target.value)} placeholder="اكتب مشكلتك هنا..." />
                                <button onClick={async()=>{
                                    if(!msgInput) return;
                                    await client.from('support_messages').insert([{tenant_id: tenant.id, sender: 'client', message: msgInput}]);
                                    setMsgInput(''); loadChat();
                                }} className="bg-indigo-600 text-white px-4 rounded-xl font-black">إرسال</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
