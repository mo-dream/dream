<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Cloud POS v25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --gold: #b68c58; --accent: #6366f1; }
        [data-theme='food'] { --accent: #f97316; --bg: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1920'); }
        [data-theme='retail'] { --accent: #10b981; --bg: url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=1920'); }
        [data-theme='auto'] { --accent: #eab308; --bg: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?q=80&w=1920'); }

        body { background: #020617; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        /* 🌌 خلفية "دريم" الأصلية لشاشة الدخول */
        .brand-layer { 
            position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo-watermark {
            position: absolute; width: 60%; opacity: 0.05; filter: blur(2px); pointer-events: none;
        }

        /* 🖼️ الصور الديناميكية للمحلات */
        .dynamic-bg { 
            position: fixed; inset: 0; 
            background-image: linear-gradient(rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.95)), var(--bg); 
            background-size: cover; background-position: center; 
            z-index: -1; transition: 1.5s ease; opacity: 0;
        }
        [data-logged="true"] .dynamic-bg { opacity: 1; }
        [data-logged="true"] .brand-layer { display: none; }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 40px; }
        input, select { background: #fff !important; color: #000 !important; font-weight: 900 !important; border-radius: 12px !important; padding: 14px !important; border: none !important; width: 100%; outline: none; }
        .tab-active { background: var(--accent) !important; color: white !important; box-shadow: 0 0 30px var(--accent); }
        .btn-gold { background: linear-gradient(135deg, #b68c58, #8a6d44); color: #fff; font-weight: 900; box-shadow: 0 10px 30px rgba(182, 140, 88, 0.3); }

        @media print { .no-print { display: none !important; } #receipt { display: block !important; width: 80mm; color: #000; background: #fff; padding: 4mm; } }
        #receipt { display: none; }
    </style>
</head>
<body>
    <!-- طبقة الهوية البصرية (دريم) -->
    <div class="brand-layer no-print">
        <img src="logo.png" class="brand-logo-watermark" />
    </div>

    <!-- طبقة المحلات -->
    <div class="dynamic-bg no-print"></div>

    <div id="root
