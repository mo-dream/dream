<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Next-Gen POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* نظام السمات الذكي (Themes) */
        :root { --accent: 99, 102, 241; --bg-1: #0f172a; --bg-2: #1e1b4b; }
        
        /* سمة المطعم */
        [data-theme='food'] { --accent: 249, 115, 22; --bg-1: #1c0d02; --bg-2: #431407; }
        /* سمة الأسواق */
        [data-theme='retail'] { --accent: 34, 197, 94; --bg-1: #022c22; --bg-2: #064e3b; }
        /* سمة السيارات والزيوت */
        [data-theme='auto'] { --accent: 234, 179, 8; --bg-1: #171717; --bg-2: #262626; }

        body { 
            margin: 0; background: var(--bg-1); color: white; font-family: 'Cairo', sans-serif;
            transition: all 0.5s ease; overflow-x: hidden;
        }

        /* خلفية الـ Mesh Gradient المتحركة مثل الصورة */
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, var(--bg-1) 0%, var(--bg-2) 100%);
            z-index: -2;
        }
        .mesh-sphere {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(var(--accent), 0.15) 0%, transparent 70%);
            filter: blur(80px); z-index: -1; animation: float 20s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(20%, 20%); }
        }

        /* الكروت الزجاجية (Glassmorphism) */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
        }

        /* المدخلات الاحترافية */
        input, select {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #000 !important; font-weight: 900 !important;
            border-radius: 20px !important; padding: 16px !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-glow {
            background: rgb(var(--accent));
            box-shadow: 0 0 20px rgba(var(--accent), 0.4);
            transition: 0.3s;
        }
        .btn-glow:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(var(--accent), 0.6); }

        .tab-active { background: rgba(255, 255, 255, 0.1) !important; border: 1px solid rgba(255,255,255,0.2) !important; }
    </style>
</head>
<body id="body-tag">
    <div class="mesh-bg"></div>
    <div class="mesh-sphere" style="top: -10%; left: -10%;"></div>
    <div class="mesh-sphere" style="bottom: -10%; right: -10%; animation-delay: -5s;"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0 });
            const [license, setLicense] = useState('');

            // تحديث السمة البصرية بناءً على نوع النشاط
            useEffect(() => {
                if (tenant) {
                    document.getElementById('body-tag').setAttribute('data-theme', tenant.business_type || 'food');
                    loadData();
                }
            }, [tenant]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            const addToCart = (item, qty, label, isPrice = false) => {
                let fQty = isPrice ? parseFloat(qty)/item.price : qty;
                let fPrice = isPrice ? parseFloat(qty) : item.price * qty;
                setCart([...cart, { ...item, cart_qty: fQty, price: fPrice, cart_label: label, id: Date.now(), original_id: item.id }]);
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="glass w-full max-w-md p-12 text-center">
                        <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[2.5rem] mx-auto mb-10 flex items-center justify-center text-5xl font-black italic shadow-2xl shadow-indigo-500/50">D</div>
                        <h1 className="text-4xl font-black mb-12 tracking-tighter italic">DREAM SYSTEMS</h1>
                        <input className="mb-6 text-center text-2xl" placeholder="كود التفعيل" onChange={e=>setLicense(e.target.value.toUpperCase())} />
                        <button onClick={async ()=>{
                            const {data} = await client.from('tenants').select('*').eq('license_key', license).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); } else alert("الكود خطأ");
                        }} className="w-full py-5 btn-glow rounded-3xl font-black text-xl">تنشيط السحاب 🚀</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-6 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex flex-col">
                            <h1 className="font-black text-2xl italic tracking-tighter uppercase">{tenant.business_name}</h1>
                            <div className="flex gap-2 mt-1">
                                <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                <span className="text-[10px] font-bold opacity-50 uppercase tracking-widest">Cloud Terminal Active</span>
                            </div>
                        </div>
                        <div className="flex bg-white/5 backdrop-blur-md p-1.5 rounded-3xl gap-1 no-print">
                            {['pos', 'inventory', 'reports', 'settings'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-6 py-3 rounded-2xl font-black text-[11px] uppercase tracking-wider transition-all ${view===v?'tab-active':'opacity-40 hover:opacity-100'}`}>
                                    {v==='pos'?'البيع':v==='inventory'?'المخزن':v==='reports'?'التقارير':'الإعدادات'}
                                </button>
                            ))}
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-4 text-rose-500 font-black">✕</button>
                        </div>
                    </header>

                    <main className="p-6 lg:p-10 max-w-7xl mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_420px] gap-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(item => (
                                        <div key={item.id} className="glass p-7 cursor-pointer group transition-all" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'قطعة')}>
                                            <div className="flex justify-between items-start mb-6">
                                                <span className="text-[10px] font-black px-3 py-1 rounded-full bg-white/10 tracking-widest uppercase">{item.category}</span>
                                                <div className="font-black text-xl text-indigo-400">{item.price.toLocaleString()}</div>
                                            </div>
                                            <h3 className="font-black text-2xl mb-6 group-hover:translate-x-2 transition-transform">{item.name}</h3>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-4 gap-2">
                                                    {[1, 0.5, 0.25].map(w => (
                                                        <button key={w} onClick={(e)=>{e.stopPropagation(); addToCart(item, w, w+' كغم')}} className="bg-white/5 hover:bg-white/20 py-3 rounded-xl text-xs font-black">{w}ك</button>
                                                    ))}
                                                    <button onClick={(e)=>{e.stopPropagation(); const p=prompt('المبلغ:'); if(p) addToCart(item, p, p+' د.ع', true)}} className="btn-glow py-3 rounded-xl text-xs font-black">💰</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="glass h-[82vh] flex flex-col sticky top-28 overflow-hidden">
                                    <div className="p-6 bg-white/5 border-b border-white/10 flex justify-between items-center">
                                        <span className="font-black text-xs tracking-[0.3em] uppercase opacity-50">Current Order</span>
                                        <span className="font-black text-indigo-400">#{Math.floor(Math.random()*9000)}</span>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex justify-between items-center animate-in slide-in-from-right duration-300">
                                                <div>
                                                    <p className="font-black text-lg">{c.name}</p>
                                                    <p className="text-[10px] font-bold opacity-40 uppercase tracking-widest">{c.cart_label}</p>
                                                </div>
                                                <div className="flex items-center gap-5">
                                                    <span className="font-black text-xl">{c.price.toLocaleString()}</span>
                                                    <button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="w-8 h-8 rounded-full bg-rose-500/20 text-rose-500 font-black">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-10 bg-white/[0.02] border-t border-white/10">
                                        <div className="flex justify-between items-end mb-10">
                                            <span className="text-xs font-black opacity-30 uppercase tracking-widest">Total Amount</span>
                                            <span className="text-5xl font-black tracking-tighter text-indigo-400">{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span>
                                        </div>
                                        <button onClick={()=>{window.print(); window.location.reload();}} className="w-full py-6 btn-glow rounded-[2.5rem] font-black text-2xl uppercase tracking-tighter">Confirm & Print ✅</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="glass p-12 animate-in fade-in zoom-in duration-500">
                                <h2 className="text-3xl font-black mb-12 italic tracking-tighter text-indigo-400 uppercase">Management Console</h2>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-16">
                                    <input placeholder="اسم المادة" id="nn" />
                                    <input placeholder="القسم" id="cc" />
                                    <input type="number" placeholder="السعر" id="pp" />
                                    <button onClick={async ()=>{
                                        const n=document.getElementById('nn').value, p=document.getElementById('pp').value, c=document.getElementById('cc').value;
                                        if(n&&p) { await client.from('products').insert([{name:n, price:parseFloat(p), category:c||'عام', tenant_id:tenant.id}]); loadData(); }
                                    }} className="btn-glow py-4 rounded-2xl font-black">إضافة مادة ✨</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(i => (
                                        <div key={i.id} className="glass p-6 flex justify-between items-center">
                                            <div><b className="text-xl">{i.name}</b><p className="text-xs opacity-40">{i.category}</p></div>
                                            <button onClick={async()=> {await client.from('products').delete().eq('id',i.id); loadData();}} className="text-rose-500 font-black">✕</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-10 text-center opacity-10 text-[9px] font-black uppercase tracking-[1em]">Dream Systems Premium Cloud Terminal</footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
