<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Elite POS & Barcode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --accent: #6366f1; --bg-img: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop'); }
        [data-theme='food'] { --accent: #ea580c; --bg-img: url('https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='retail'] { --accent: #059669; --bg-img: url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='auto'] { --accent: #ca8a04; --bg-img: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?q=80&w=2000&auto=format&fit=crop'); }

        body { background-color: #020617; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .dynamic-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)), var(--bg-img); background-size: cover; background-position: center; z-index: -2; transition: 1s; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px; }
        input, select { background: rgba(255, 255, 255, 0.9) !important; color: #000 !important; font-weight: 900 !important; border-radius: 15px !important; padding: 12px !important; border: none !important; }
        .tab-active { background: var(--accent) !important; color: white !important; box-shadow: 0 0 25px var(--accent); }
        .barcode-input { background: rgba(var(--accent-rgb), 0.1) !important; border: 2px solid var(--accent) !important; color: white !important; }
    </style>
</head>
<body id="body-tag">
    <div class="dynamic-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [barcodeSearch, setBarcodeSearch] = useState('');
            const [newItem, setNewItem] = useState({ name: '', price: '', category: 'عام', unit: 'piece', barcode: '' });
            const barcodeRef = useRef(null);

            useEffect(() => {
                if (tenant) {
                    document.getElementById('body-tag').setAttribute('data-theme', tenant.business_type);
                    loadData();
                    // التركيز التلقائي على حقل الباركود عند فتح صفحة البيع
                    if(view === 'pos' && barcodeRef.current) barcodeRef.current.focus();
                }
            }, [tenant, view]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            // البحث والبيع بالباركود
            const handleBarcodeScan = (e) => {
                const code = e.target.value;
                setBarcodeSearch(code);
                
                const product = items.find(i => i.barcode === code);
                if (product) {
                    addToCart(product, 1, 'قطعة (سكنر)');
                    setBarcodeSearch(''); // تصفير الحقل للمرة القادمة
                }
            };

            const addToCart = (item, qty, label, isPrice = false) => {
                let fQty = isPrice ? parseFloat(qty)/item.price : qty;
                let fPrice = isPrice ? parseFloat(qty) : item.price * qty;
                setCart(prev => [...prev, { ...item, cart_qty: fQty, price: fPrice, cart_label: label, id: Date.now(), original_id: item.id }]);
            };

            const checkout = async () => {
                if(!cart.length) return;
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: cart.reduce((a,b)=>a+b.price, 0) }]).select().single();
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: (t.stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                }
                window.print(); window.location.reload();
            };

            if (!tenant) return <div className="p-20 text-center font-black">يرجى تسجيل الدخول...</div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-6 flex justify-between items-center sticky top-0 z-50 no-print">
                        <h1 className="font-black text-2xl italic tracking-tighter uppercase" style={{color: 'var(--accent)'}}>{tenant.business_name}</h1>
                        <div className="flex bg-white/5 backdrop-blur-md p-1.5 rounded-2xl gap-1">
                            {['pos', 'inventory', 'reports'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-6 py-2 rounded-xl font-black text-xs transition-all ${view===v?'tab-active':'opacity-40'}`}>
                                    {v==='pos'?'البيع 🛒':v==='inventory'?'المخزن 📦':'التقارير 📊'}
                                </button>
                            ))}
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-4 text-rose-500 font-black">✕</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-[1600px] mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="space-y-6">
                                {/* حقل الباركود الذكي */}
                                <div className="flex justify-center mb-8">
                                    <div className="relative w-full max-w-md">
                                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-black opacity-40">🔍</span>
                                        <input 
                                            ref={barcodeRef}
                                            value={barcodeSearch}
                                            onChange={handleBarcodeScan}
                                            placeholder="امسح الباركود هنا للبيع السريع..." 
                                            className="w-full !pr-12 !bg-white border-4 border-indigo-500/30 focus:border-indigo-500 !text-xl"
                                        />
                                    </div>
                                </div>

                                <div className="grid lg:grid-cols-[1fr_400px] gap-8">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {items.map(item => (
                                            <div key={item.id} className="glass p-6 cursor-pointer group hover:scale-[1.02] transition-all" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'قطعة')}>
                                                <div className="flex justify-between items-start">
                                                    <span className="text-[9px] font-black px-2 py-1 rounded bg-white/10 opacity-60 uppercase">{item.category}</span>
                                                    <div className="font-black text-lg" style={{color: 'var(--accent)'}}>{item.price.toLocaleString()}</div>
                                                </div>
                                                <h3 className="font-bold text-xl mt-3">{item.name}</h3>
                                                <p className="text-[10px] opacity-30 mt-1">Barcode: {item.barcode || 'N/A'}</p>
                                                {item.unit_type === 'kg' && (
                                                    <div className="grid grid-cols-3 gap-1 mt-4">
                                                        {[1, 0.5, 0.25].map(w => (
                                                            <button key={w} onClick={(e)=>{e.stopPropagation(); addToCart(item, w, w+' كغم')}} className="bg-white/5 py-2 rounded-lg text-xs font-bold hover:bg-white/20">{w}ك</button>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    {/* السلة */}
                                    <div className="glass h-[75vh] flex flex-col sticky top-28 overflow-hidden">
                                        <div className="p-4 bg-white/5 font-black text-center text-xs opacity-40 uppercase">Invoice Items</div>
                                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                            {cart.map((c, i) => (
                                                <div key={i} className="flex justify-between items-center border-b border-white/5 pb-2">
                                                    <div><p className="font-bold text-sm">{c.name}</p><small className="opacity-40">{c.cart_label}</small></div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-black" style={{color: 'var(--accent)'}}>{c.price.toLocaleString()}</span>
                                                        <button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500">✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="p-6 bg-black/20 border-t border-white/5">
                                            <div className="flex justify-between font-black text-2xl mb-4"><span>المجموع</span><span style={{color: 'var(--accent)'}}>{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span></div>
                                            <button onClick={checkout} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black text-lg shadow-lg">تأكيد البيع ✅</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="glass p-8 animate-in fade-in duration-500">
                                <h2 className="text-2xl font-black mb-8 italic uppercase" style={{color: 'var(--accent)'}}>إدارة المخزن والباركود</h2>
                                
                                {/* فورم الإضافة مع الباركود */}
                                <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-12 bg-white/5 p-6 rounded-2xl">
                                    <input placeholder="الباركود (استخدم السكنر)" value={newItem.barcode} onChange={e=>setNewItem({...newItem, barcode:e.target.value})} className="lg:col-span-2 !bg-indigo-500/10 !text-white border-2 border-indigo-500/30" />
                                    <input placeholder="اسم المادة" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} />
                                    <input type="number" placeholder="السعر" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} />
                                    <select value={newItem.unit} onChange={e=>setNewItem({...newItem, unit:e.target.value})}><option value="piece">قطعة</option><option value="kg">كيلو</option></select>
                                    <button onClick={async ()=>{
                                        if(!newItem.name || !newItem.price) return alert("اكمل البيانات");
                                        await client.from('products').insert([{...newItem, price:parseFloat(newItem.price), unit_type:newItem.unit, tenant_id:tenant.id}]);
                                        loadData(); setNewItem({name:'', price:'', category:'عام', unit:'piece', barcode:''});
                                    }} className="bg-indigo-600 py-3 rounded-xl font-black shadow-lg">إضافة مادة ✨</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {items.map(i => (
                                        <div key={i.id} className="glass p-5 flex flex-col gap-3">
                                            <div className="flex justify-between items-center">
                                                <div><b className="text-lg">{i.name}</b><p className="text-[10px] opacity-40">BC: {i.barcode || 'لا يوجد'}</p></div>
                                                <span className="text-xs font-black px-2 py-1 rounded bg-white/5">مخزن: {i.stock_quantity.toFixed(2)}</span>
                                            </div>
                                            <div className="flex gap-2">
                                                <input type="number" placeholder="كمية" className="!p-1 !text-xs !w-20" id={`q-${i.id}`} />
                                                <button onClick={async ()=>{
                                                    const val = document.getElementById(`q-${i.id}`).value;
                                                    if(val) { await client.from('products').update({stock_quantity: i.stock_quantity + parseFloat(val)}).eq('id', i.id); loadData(); }
                                                }} className="bg-white/10 flex-1 py-1 rounded-lg text-[10px] font-black">تجهيز واصل (+)</button>
                                                <button onClick={async()=>{if(confirm('حذف؟')) {await client.from('products').delete().eq('id',i.id); loadData();}}} className="text-rose-500 font-black">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
