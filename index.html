<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | 3D Professional POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* خلفية 3D عصرية متحركة */
        body { 
            margin: 0; padding: 0;
            background: linear-gradient(125deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
            z-index: -1; pointer-events: none;
        }

        /* تصميم الزجاج (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* إصلاح مربع الكود وكل المدخلات لظهور الكتابة بوضوح ودعم اللصق */
        input, select {
            background: rgba(255, 255, 255, 0.9) !important; /* خلفية بيضاء لظهور الخط */
            color: #000 !important; /* خط أسود غامق جداً */
            border: 2px solid transparent !important;
            padding: 16px !important;
            border-radius: 18px !important;
            font-weight: 900 !important;
            font-size: 1.2rem !important;
            outline: none !important;
            width: 100%;
            transition: 0.3s;
        }
        
        input:focus {
            background: #fff !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .tab-active { background: linear-gradient(135deg, #4f46e5, #818cf8) !important; color: white !important; }
        
        @media print { .no-print { display: none; } #print-area { display: block !important; width: 80mm; background: white; color: black; padding: 5mm; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0, orders: [] });
            const [license, setLicense] = useState('');
            const [showChat, setShowChat] = useState(false);
            const [chat, setChat] = useState([]);
            const [msg, setMsg] = useState('');
            const [newItem, setNewItem] = useState({ name: '', price: '', category: 'عام', unit: 'piece' });

            useEffect(() => {
                if (tenant) {
                    const check = async () => {
                        const { data } = await client.from('tenants').select('*').eq('id', tenant.id).maybeSingle();
                        if (!data) { localStorage.clear(); window.location.reload(); } else { setTenant(data); loadData(); loadStats(); loadChat(); }
                    };
                    check();
                }
            }, []);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('*, order_items(*)').eq('tenant_id', tenant.id).gte('created_at', today);
                const { data: e } = await client.from('expenses').select('*').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ sales: s?.reduce((a,b)=>a+b.total_amount, 0)||0, expenses: e?.reduce((a,b)=>a+b.amount, 0)||0, orders: s || [] });
            }

            async function loadChat() {
                const { data } = await client.from('support_messages').select('*').eq('tenant_id', tenant.id).order('created_at');
                if(data) setChat(data);
            }

            const checkout = async () => {
                if(!cart.length) return;
                const total = cart.reduce((a,b)=>a+b.price, 0);
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: total }]).select().single();
                const orderItems = cart.map(c => ({ order_id: order.id, product_name: c.name, qty: c.cart_qty, price: c.price, item_note: c.note }));
                await client.from('order_items').insert(orderItems);
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: (t.stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                }
                window.print(); window.location.reload();
            };

            // شاشة تفعيل النظام (3D Style)
            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="glass-card w-full max-w-md p-10 text-center animate-in fade-in duration-700">
                        <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[2rem] mx-auto mb-8 flex items-center justify-center text-5xl font-black text-white shadow-2xl italic shadow-indigo-500/50">D</div>
                        <h1 className="text-3xl font-black mb-10 italic tracking-widest text-indigo-400">DREAM SYSTEMS</h1>
                        <div className="space-y-4">
                            <input 
                                className="text-center" 
                                placeholder="أدخل كود التفعيل" 
                                value={license} 
                                onChange={e => setLicense(e.target.value.toUpperCase())}
                            />
                            <button onClick={async ()=>{
                                if(!license) return;
                                const {data} = await client.from('tenants').select('*').eq('license_key', license).maybeSingle();
                                if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); window.location.reload(); } else alert("الكود غير صحيح");
                            }} className="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black text-xl shadow-lg hover:shadow-indigo-500/40 transition-all active:scale-95">تنشيط السحاب 🚀</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* الفاتورة للطباعة */}
                    <div id="print-area" className="hidden">
                        <div className="text-center mb-4"><h2 className="text-xl font-bold">{tenant.business_name}</h2><p>هاتف: {tenant.phone_number}</p></div>
                        <table className="w-full text-sm">
                            {cart.map((c, i) => (<tr key={i}><td align="right">{c.name}</td><td align="left">{c.price.toLocaleString()}</td></tr>))}
                        </table>
                        <div className="text-center mt-4 border-t pt-2"><h3 className="text-lg font-bold">المجموع: {cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</h3></div>
                    </div>

                    <header className="p-4 flex justify-between items-center sticky top-0 z-50 no-print">
                        <h1 className="font-black text-xl italic text-indigo-400 uppercase tracking-tighter">{tenant.business_name}</h1>
                        <div className="flex bg-white/5 backdrop-blur-md p-1 rounded-2xl gap-1">
                            {['pos', 'inventory', 'reports', 'settings'].map(v => (
                                <button key={v} onClick={()=>setView(v)} className={`px-4 py-2 rounded-xl font-black text-[10px] transition-all ${view===v?'tab-active':'text-slate-400'}`}>
                                    {v==='pos'?'البيع':v==='inventory'?'المخزن':v==='reports'?'التقارير':'الإعدادات'}
                                </button>
                            ))}
                            <button onClick={()=>setShowChat(true)} className="px-4 py-2 rounded-xl bg-amber-500/20 text-amber-400 text-[10px] font-black">الدعم</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-7xl mx-auto w-full no-print">
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_400px] gap-8">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(item => (
                                        <div key={item.id} className="glass-card p-6 cursor-pointer hover:border-indigo-500/50 transition-all group" onClick={() => item.unit_type !== 'kg' && setCart([...cart, {...item, cart_qty:1, cart_label:'قطعة', note:'', original_id:item.id}])}>
                                            <span className="text-[10px] font-black text-indigo-400 bg-indigo-500/10 px-2 py-1 rounded">{item.category}</span>
                                            <h3 className="font-black text-xl mt-3 group-hover:text-indigo-400 transition-colors">{item.name}</h3>
                                            <div className="font-black text-indigo-500 mt-2">{item.price.toLocaleString()} د.ع</div>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-4 gap-1 mt-5">
                                                    {[1, 0.5, 0.25].map(w => (
                                                        <button key={w} onClick={(e)=>{e.stopPropagation(); setCart([...cart, {...item, price:item.price*w, cart_qty:w, cart_label:w+'كغم', note:'', original_id:item.id}])}} className="bg-white/5 p-2 rounded-lg text-[10px] font-bold hover:bg-indigo-600 transition-all">{w}ك</button>
                                                    ))}
                                                    <button onClick={(e)=>{e.stopPropagation(); const p=prompt('ادخل المبلغ:'); if(p) setCart([...cart, {...item, price:parseFloat(p), cart_qty:parseFloat(p)/item.price, cart_label:p+' د.ع', note:'', original_id:item.id}])}} className="bg-indigo-600 p-2 rounded-lg text-[10px] font-bold">مخصص</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="glass-card h-[80vh] flex flex-col sticky top-24 overflow-hidden border-indigo-500/20">
                                    <div className="p-4 bg-indigo-600 text-white font-black text-center text-xs tracking-widest">INVOICE</div>
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex flex-col border-b border-white/5 pb-4">
                                                <div className="flex justify-between items-center font-black">
                                                    <div><p>{c.name}</p><small className="text-indigo-400">{c.cart_label}</small></div>
                                                    <div className="flex items-center gap-3"><span>{c.price.toLocaleString()}</span><button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500">✕</button></div>
                                                </div>
                                                <input className="!p-2 text-[10px] mt-2 !bg-white/5 !text-white !font-bold" placeholder="ملاحظة..." value={c.note} onChange={e=>{const n=[...cart]; n[i].note=e.target.value; setCart(n);}} />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-6 bg-black/20 border-t border-white/5">
                                        <div className="flex justify-between font-black text-3xl mb-6"><span>المجموع</span><span className="text-indigo-400">{cart.reduce((a,b)=>a+b.price, 0).toLocaleString()}</span></div>
                                        <button onClick={checkout} className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black text-xl shadow-lg active:scale-95 transition-all">تأكيد وطباعة ✅</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="glass-card p-10 animate-in fade-in duration-500">
                                <h2 className="text-2xl font-black mb-8 italic text-indigo-400">إدارة المواد والمخزن</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                                    <input placeholder="اسم المادة" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} />
                                    <input placeholder="القسم" value={newItem.category} onChange={e=>setNewItem({...newItem, category:e.target.value})} />
                                    <input type="number" placeholder="السعر" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} />
                                    <select value={newItem.unit} onChange={e=>setNewItem({...newItem, unit:e.target.value})}><option value="piece">بالقطعة</option><option value="kg">بالكيلو</option></select>
                                    <button onClick={async ()=>{
                                        if(!newItem.name || !newItem.price) return alert("املاً البيانات");
                                        await client.from('products').insert([{...newItem, price:parseFloat(newItem.price), unit_type:newItem.unit, tenant_id:tenant.id}]);
                                        loadData(); setNewItem({name:'', price:'', category:'عام', unit:'piece'});
                                    }} className="lg:col-span-4 bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">إضافة للقائمة ✨</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {items.map(i => (
                                        <div key={i.id} className="p-5 border border-white/5 rounded-2xl flex justify-between items-center bg-white/5">
                                            <div><b className="text-lg">{i.name}</b><p className="text-xs text-indigo-400">المخزون: {i.stock_quantity?.toFixed(2)}</p></div>
                                            <div className="flex gap-2">
                                                <button onClick={async()=>{const q=prompt("الكمية:"); if(q){await client.from('products').update({stock_quantity: i.stock_quantity+parseFloat(q)}).eq('id',i.id); loadData();}}} className="bg-indigo-600/30 text-indigo-300 px-4 py-2 rounded-xl font-bold">تجهيز</button>
                                                <button onClick={async()=>{if(confirm('حذف؟')){await client.from('products').delete().eq('id',i.id); loadData();}}} className="text-rose-500 font-black">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {showChat && (
                        <div className="fixed bottom-10 left-10 z-[100] glass-card w-full max-w-sm h-[500px] flex flex-col shadow-2xl overflow-hidden animate-in zoom-in">
                            <div className="p-4 bg-indigo-600 text-white font-black flex justify-between shadow-lg"><span>دعم Dream Systems</span><button onClick={()=>setShowChat(false)}>✕</button></div>
                            <div className="flex-1 p-4 overflow-y-auto space-y-3">
                                {chat.map(m=><div key={m.id} className={`p-3 rounded-2xl text-xs font-bold ${m.sender==='client'?'bg-indigo-500/20 text-indigo-200 mr-auto rounded-bl-none':'bg-white/10 text-white ml-auto rounded-br-none'}`}>{m.message}</div>)}
                            </div>
                            <div className="p-4 bg-black/40 flex gap-2">
                                <input className="flex-1 !p-2 !text-sm" value={msg} onChange={e=>setMsg(e.target.value)} placeholder="اكتب هنا..." />
                                <button onClick={async ()=>{if(!msg)return; await client.from('support_messages').insert([{tenant_id:tenant.id, sender:'client', message:msg}]); setMsg(''); loadChat();}} className="bg-indigo-600 px-5 rounded-xl font-black">إرسال</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
