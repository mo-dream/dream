<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Systems | Elite Business v21</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --accent: #6366f1; --bg-img: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop'); }
        [data-theme='food'] { --accent: #ea580c; --bg-img: url('https://images.unsplash.com/photo-1550503990-bcff333d837a?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='retail'] { --accent: #059669; --bg-img: url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2000&auto=format&fit=crop'); }
        [data-theme='auto'] { --accent: #ca8a04; --bg-img: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?q=80&w=2000&auto=format&fit=crop'); }

        body { background-color: #020617; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .dynamic-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(2, 6, 23, 0.94), rgba(2, 6, 23, 0.94)), var(--bg-img); background-size: cover; background-position: center; z-index: -2; transition: 1s; }
        
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(40px) saturate(120%); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 40px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        input, select { background: rgba(255, 255, 255, 0.95) !important; color: #000 !important; font-weight: 900 !important; border-radius: 14px !important; padding: 14px !important; border: none !important; width: 100%; outline: none; }
        .tab-active { background: var(--accent) !important; color: white !important; box-shadow: 0 0 25px var(--accent); }
        .number-glow { text-shadow: 0 0 15px var(--accent); }

        @media print {
            .no-print { display: none !important; }
            #receipt-area { display: block !important; width: 80mm; padding: 4mm; color: black !important; background: white !important; font-family: 'Arial', sans-serif; margin: 0; }
            body { background: white !important; }
        }
        #receipt-area { display: none; }
    </style>
</head>
<body id="body-tag">
    <div class="dynamic-bg no-print"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const client = supabase.createClient('https://dyxdtlbqurnovrymopch.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGR0bGJxdXJub3ZyeW1vcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzY4OTgsImV4cCI6MjEwMzE1Mjg5OH0.YyfoQ6b5DUlqQS7-AN-p-zH3GLK00zvtEIBcoMhAYPA');

        const AnimatedCounter = ({ value }) => {
            const [display, setDisplay] = useState(0);
            const lastVal = useRef(0);
            useEffect(() => {
                const start = lastVal.current;
                const end = parseInt(value) || 0;
                const duration = 600;
                let startTime = null;
                const anim = (now) => {
                    if (!startTime) startTime = now;
                    const progress = Math.min((now - startTime) / duration, 1);
                    setDisplay(Math.floor(progress * (end - start) + start));
                    if (progress < 1) requestAnimationFrame(anim);
                };
                requestAnimationFrame(anim);
                lastVal.current = end;
            }, [value]);
            return <span>{display.toLocaleString()}</span>;
        };

        function App() {
            const [tenant, setTenant] = useState(() => JSON.parse(localStorage.getItem('dream_session')));
            const [view, setView] = useState('pos');
            const [items, setItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [stats, setStats] = useState({ sales: 0, expenses: 0 });
            const [bcSearch, setBcSearch] = useState('');
            const [modal, setModal] = useState({ type: null, data: null });
            const [newItem, setNewItem] = useState({ id: null, name: '', price: '', category: 'عام', unit: 'piece', barcode: '', cost: '' });

            const searchRef = useRef(null);
            const unitLabel = tenant?.business_type === 'auto' ? 'لتر' : 'كيلو';

            useEffect(() => {
                if (tenant) {
                    document.getElementById('body-tag').setAttribute('data-theme', tenant.business_type);
                    loadData(); loadStats();
                }
            }, [tenant]);

            useEffect(() => { if(view === 'pos' && searchRef.current) searchRef.current.focus(); }, [view]);

            async function loadData() {
                const { data } = await client.from('products').select('*').eq('tenant_id', tenant.id).order('name');
                if (data) setItems(data);
            }

            async function loadStats() {
                const today = new Date().toISOString().split('T')[0];
                const { data: s } = await client.from('orders').select('total_amount').eq('tenant_id', tenant.id).gte('created_at', today);
                const { data: e } = await client.from('expenses').select('amount').eq('tenant_id', tenant.id).gte('created_at', today);
                setStats({ sales: s?.reduce((a,b)=>a+b.total_amount, 0)||0, expenses: e?.reduce((a,b)=>a+b.amount, 0)||0 });
            }

            const addToCart = (item, qty, label, isPriceInput = false) => {
                let fQty = isPriceInput ? parseFloat(qty)/item.price : qty;
                let fPrice = isPriceInput ? parseFloat(qty) : item.price * qty;
                setCart(prev => [...prev, { ...item, cart_qty: fQty, price: fPrice, cart_label: label, id: Date.now(), original_id: item.id, item_note: '' }]);
                setModal({type: null});
            };

            const checkout = async () => {
                if(!cart.length) return;
                const total = cart.reduce((a,b)=>a+b.price, 0);
                const { data: order } = await client.from('orders').insert([{ tenant_id: tenant.id, total_amount: total }]).select().single();
                const itemsToSave = cart.map(c => ({ order_id: order.id, product_name: c.name, qty: c.cart_qty, price: c.price, item_note: c.item_note }));
                await client.from('order_items').insert(itemsToSave);
                for(const c of cart) {
                    const t = items.find(i=>i.id === c.original_id);
                    await client.from('products').update({stock_quantity: (t.stock_quantity || 0) - c.cart_qty}).eq('id', c.original_id);
                }
                setTimeout(() => { window.print(); window.location.reload(); }, 300);
            };

            // نافذة السحب اليدوي (Manual Expense Modal)
            const ExpenseModal = () => {
                const [amt, setAmt] = useState('');
                const [reason, setReason] = useState('');
                const submit = async () => {
                    if(!amt || !reason) return;
                    await client.from('expenses').insert([{ tenant_id: tenant.id, amount: parseFloat(amt), reason: reason }]);
                    setModal({type:null}); loadStats();
                };
                return (
                    <div className="modal-overlay no-print">
                        <div className="glass p-10 w-full max-w-sm animate-in zoom-in duration-300">
                            <h3 className="text-2xl font-black mb-6 text-rose-500">تسجيل سحب من الصندوق</h3>
                            <input autoFocus type="number" placeholder="المبلغ المسحوب" value={amt} onChange={e=>setAmt(e.target.value)} className="mb-4 !text-center !text-2xl" />
                            <input placeholder="السبب (مثلاً: أجور عمال، غداء..)" value={reason} onChange={e=>setReason(e.target.value)} className="mb-6 !text-center" />
                            <div className="flex gap-2">
                                <button onClick={submit} className="flex-1 py-4 bg-rose-600 rounded-2xl font-black text-lg shadow-lg">تأكيد السحب 💸</button>
                                <button onClick={()=>setModal({type:null})} className="px-6 py-4 bg-white/10 rounded-2xl font-bold">إلغاء</button>
                            </div>
                        </div>
                    </div>
                );
            };

            if (!tenant) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass w-full max-w-md p-16 text-center border-white/10 no-print">
                        <div className="w-24 h-24 bg-indigo-600 rounded-3xl mx-auto mb-10 flex items-center justify-center text-5xl font-black shadow-indigo-600/30 shadow-xl italic text-white">D</div>
                        <h1 className="text-3xl font-black mb-10 text-indigo-400 uppercase tracking-widest italic">Dream Systems</h1>
                        <input className="text-center text-xl p-5 mb-6 rounded-2xl w-full !bg-white !text-black" placeholder="DRM-XXXX" id="login-key" />
                        <button onClick={async ()=>{
                            const v = document.getElementById('login-key').value.toUpperCase();
                            const {data} = await client.from('tenants').select('*').eq('license_key', v).maybeSingle();
                            if(data) { localStorage.setItem('dream_session', JSON.stringify(data)); setTenant(data); window.location.reload(); } else alert("خطأ");
                        }} className="w-full py-5 bg-indigo-600 rounded-2xl font-black text-xl shadow-lg">دخول آمن 🚀</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* الفاتورة */}
                    <div id="receipt-area">
                        <div style={{textAlign: 'center', borderBottom: '1px dashed black', paddingBottom: '10px', marginBottom: '10px'}}>
                            <h2 style={{fontSize: '22px', fontWeight: '900', margin: '0'}}>{tenant.business_name}</h2>
                            <p style={{fontSize: '14px', margin: '5px 0'}}>رقم الهاتف: {tenant.phone_number || '---'}</p>
                            <p style={{fontSize: '11px'}}>{new Date().toLocaleString()}</p>
                        </div>
                        <table style={{width: '100%', fontSize: '13px', borderCollapse: 'collapse'}}>
                            <thead><tr style={{borderBottom: '1px solid black'}}><th align="right">المادة</th><th align="center">الكمية</th><th align="left">السعر</th></tr></thead>
                            <tbody>
                                {cart.map((c, i) => (
                                    <tr key={i} style={{borderBottom: '1px solid #eee'}}><td style={{padding: '5px 0'}}><b>{c.name}</b>{c.item_note && <div style={{fontSize: '10px'}}>{c.item_note}</div>}</td><td align="center">{c.cart_qty.toFixed(2)}</td><td align="left">{c.price.toLocaleString()}</td></tr>
                                ))}
                            </tbody>
                        </table>
                        <div style={{marginTop: '15px', borderTop: '2px solid black', paddingTop: '10px', textAlign: 'center'}}>
                            <h3 style={{fontSize: '20px', fontWeight: '900'}}>المجموع: {cart.reduce((a,b)=>a+b.price, 0).toLocaleString()} د.ع</h3>
                            <p style={{fontSize: '10px', marginTop: '15px'}}>شكراً لزيارتكم</p>
                        </div>
                    </div>

                    {/* Modals Manager */}
                    {modal.type === 'expense' && <ExpenseModal />}
                    {modal.type === 'custom_amount' && (
                        <div className="modal-overlay no-print">
                            <div className="glass p-12 w-full max-w-sm animate-in zoom-in duration-300">
                                <h3 className="text-2xl font-black mb-6 text-indigo-400">مبلغ مخصص: {modal.data.name}</h3>
                                <input autoFocus type="number" id="custom-p" placeholder="أدخل المبلغ..." className="!text-center !text-3xl mb-8" />
                                <div className="flex gap-2">
                                    <button onClick={()=>addToCart(modal.data, document.getElementById('custom-p').value, document.getElementById('custom-p').value+' د.ع', true)} className="flex-1 py-5 bg-indigo-600 rounded-2xl font-black text-xl">إضافة للسلة 🛒</button>
                                    <button onClick={()=>setModal({type:null})} className="px-6 bg-white/10 rounded-2xl font-bold">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {modal.type === 'restock' && (
                        <div className="modal-overlay no-print">
                            <div className="glass p-10 w-full max-w-md animate-in zoom-in duration-300">
                                <h3 className="text-2xl font-black mb-6 text-indigo-400 italic">تجهيز: {modal.data.name}</h3>
                                <input autoFocus id="restock-qty" type="number" placeholder={`الكمية بالـ (${unitLabel})`} className="!text-center !text-3xl mb-8" />
                                <div className="grid grid-cols-2 gap-2 mb-8">
                                    <button onClick={async ()=>{
                                        const q = parseFloat(document.getElementById('restock-qty').value);
                                        await client.from('products').update({stock_quantity: modal.data.stock_quantity + q}).eq('id', modal.data.id);
                                        await client.from('expenses').insert([{tenant_id:tenant.id, amount: q * (modal.data.cost_price||0), reason: `تجهيز كاش: ${modal.data.name}`}]);
                                        setModal({type:null}); loadData(); loadStats();
                                    }} className="bg-emerald-600 py-4 rounded-xl font-black text-xs shadow-lg">توريد كاش 💸</button>
                                    <button onClick={async ()=>{
                                        const q = parseFloat(document.getElementById('restock-qty').value);
                                        await client.from('products').update({stock_quantity: modal.data.stock_quantity + q}).eq('id', modal.data.id);
                                        setModal({type:null}); loadData();
                                    }} className="bg-indigo-600 py-4 rounded-xl font-black text-xs shadow-lg">توريد آجل ⏳</button>
                                </div>
                                <button onClick={()=>setModal({type:null})} className="w-full py-3 bg-white/5 rounded-xl font-bold">إلغاء</button>
                            </div>
                        </div>
                    )}

                    <header className="p-6 flex justify-between items-center sticky top-0 z-50 no-print">
                        <h1 className="font-black text-2xl italic tracking-tighter uppercase" style={{color: 'var(--accent)'}}>{tenant.business_name}</h1>
                        <div className="flex bg-white/5 backdrop-blur-md p-1.5 rounded-3xl gap-1 no-print">
                            <button onClick={()=>setView('pos')} className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all ${view==='pos'?'tab-active':'opacity-40'}`}>البيع</button>
                            <button onClick={()=>setView('inventory')} className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all ${view==='inventory'?'tab-active':'opacity-40'}`}>المخزن</button>
                            <button onClick={()=>setView('reports')} className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all ${view==='reports'?'tab-active':'opacity-40'}`}>التقارير</button>
                            <button onClick={()=>{localStorage.clear(); window.location.reload();}} className="px-4 text-rose-500 font-black">✕</button>
                        </div>
                    </header>

                    <main className="p-4 lg:p-8 max-w-[1600px] mx-auto w-full no-print">
                        {/* واجهة البيع */}
                        {view === 'pos' && (
                            <div className="grid lg:grid-cols-[1fr_420px] gap-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {items.map(item => (
                                        <div key={item.id} className="glass p-6 cursor-pointer group hover:scale-[1.02] transition-all" onClick={() => item.unit_type !== 'kg' && addToCart(item, 1, 'Unit')}>
                                            <div className="flex justify-between items-start">
                                                <span className="text-[9px] font-black px-2 py-1 rounded bg-white/10 opacity-60 uppercase">{item.category}</span>
                                                <div className="font-black text-lg" style={{color: 'var(--accent)'}}>{item.price.toLocaleString()}</div>
                                            </div>
                                            <h3 className="font-bold text-xl mt-3">{item.name}</h3>
                                            {item.unit_type === 'kg' && (
                                                <div className="grid grid-cols-4 gap-1 mt-4">
                                                    {[1, 0.5, 0.25].map(w => (
                                                        <button key={w} onClick={(e)=>{e.stopPropagation(); addToCart(item, w, w+' '+unitLabel)}} className="bg-white/5 hover:bg-white/20 py-2 rounded-lg text-[10px] font-bold border border-white/5">{w}</button>
                                                    ))}
                                                    <button onClick={(e)=>{e.stopPropagation(); setModal({type:'custom_amount', data:item})}} className="bg-indigo-600/30 py-2 rounded-lg text-[10px] font-black">💰</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="glass h-[78vh] flex flex-col sticky top-28 overflow-hidden bg-slate-900/40 shadow-2xl">
                                    <div className="p-4 bg-white/5 font-black text-center text-xs opacity-40 uppercase tracking-widest">Billing Engine</div>
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                        {cart.map((c, i) => (
                                            <div key={i} className="flex flex-col border-b border-white/5 pb-3">
                                                <div className="flex justify-between items-center font-black">
                                                    <div><p className="font-black text-sm">{c.name}</p><small className="opacity-30 uppercase font-bold text-[9px]">{c.cart_label}</small></div>
                                                    <div className="flex items-center gap-3"><span className="font-black">{c.price.toLocaleString()}</span><button onClick={()=>setCart(cart.filter((_,idx)=>idx!==i))} className="text-rose-500">✕</button></div>
                                                </div>
                                                <input className="!p-2 text-[10px] mt-2 !bg-white/5 !text-white !font-bold" placeholder="ملاحظة..." value={c.item_note} onChange={e=>{
                                                    const n = [...cart]; n[i].item_note = e.target.value; setCart(n);
                                                }} />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-8 bg-black/30 border-t border-white/5">
                                        <div className="flex justify-between font-black text-2xl mb-6"><span>المجموع</span><span className="number-glow text-3xl" style={{color: 'var(--accent)'}}><AnimatedCounter value={cart.reduce((a,b)=>a+b.price, 0)} /></span></div>
                                        <button onClick={checkout} className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black text-xl shadow-xl active:scale-95 transition-all">تأكيد وطباعة ✅</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="glass p-10 animate-in fade-in zoom-in duration-500">
                                <h2 className="text-3xl font-black mb-10 italic uppercase" style={{color: 'var(--accent)'}}>إدارة المخزن والمنيو</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-14 bg-white/5 p-8 rounded-[2rem] border border-white/10 shadow-2xl">
                                    <input placeholder="باركود" value={newItem.barcode} onChange={e => {
                                        const code = e.target.value.trim();
                                        const exist = items.find(i => i.barcode === code);
                                        if(exist) setNewItem({...newItem, id:exist.id, name:exist.name, price:exist.price, cost:exist.cost_price, unit:exist.unit_type, barcode:code});
                                        else setNewItem({...newItem, barcode: code, id:null});
                                    }} className="!bg-slate-800 !text-white" />
                                    <input placeholder="الاسم" value={newItem.name} onChange={e=>setNewItem({...newItem, name:e.target.value})} />
                                    <input type="number" placeholder="البيع" value={newItem.price} onChange={e=>setNewItem({...newItem, price:e.target.value})} />
                                    <input type="number" placeholder="التكلفة" value={newItem.cost} onChange={e=>setNewItem({...newItem, cost:e.target.value})} />
                                    <select value={newItem.unit} onChange={e=>setNewItem({...newItem, unit:e.target.value})}><option value="piece">قطعة</option><option value="kg">بالـ {unitLabel}</option></select>
                                    <button onClick={async ()=>{
                                        const payload = {name:newItem.name, price:parseFloat(newItem.price), cost_price:parseFloat(newItem.cost||0), unit_type:newItem.unit, barcode:newItem.barcode, tenant_id:tenant.id};
                                        if(newItem.id) await client.from('products').update(payload).eq('id', newItem.id);
                                        else await client.from('products').insert([payload]);
                                        setNewItem({id:null, name:'', price:'', category:'عام', unit:'piece', barcode:'', cost:''}); loadData();
                                    }} className="lg:col-span-5 py-4 bg-indigo-600 rounded-2xl font-black text-lg">حفظ المادة ✨</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {items.map(i => (
                                        <div key={i.id} className="glass p-6 flex flex-col gap-5 border-white/5">
                                            <div className="flex justify-between items-start">
                                                <div><b className="text-xl">{i.name}</b><p className="text-[10px] opacity-30 mt-1 uppercase">BC: {i.barcode || 'N/A'}</p></div>
                                                <span className="text-xs font-black px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">{i.stock_quantity.toFixed(2)} {i.unit_type==='kg'?unitLabel:'ق'}</span>
                                            </div>
                                            <button onClick={()=>setModal({type:'restock', data:i})} className="w-full py-3 bg-white/5 text-indigo-400 border border-indigo-500/20 rounded-xl font-black text-xs hover:bg-indigo-600 hover:text-white transition-all">توريد بضاعة (+)</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="space-y-10 animate-in slide-in-from-bottom-10 duration-700">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                                    <div className="glass p-14 border-indigo-500/10">
                                        <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">مبيعات اليوم</p>
                                        <h2 className="text-6xl font-black number-glow" style={{color: 'var(--accent)'}}><AnimatedCounter value={stats.sales} /></h2>
                                    </div>
                                    <div className="glass p-14 border-rose-500/10">
                                        <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">المسحوبات</p>
                                        <h2 className="text-6xl font-black text-rose-500"><AnimatedCounter value={stats.expenses} /></h2>
                                    </div>
                                    <div className="glass p-14 border-emerald-500/10">
                                        <p className="text-xs font-black opacity-30 uppercase mb-4 tracking-widest">الصافي الفعلي</p>
                                        <h2 className="text-6xl font-black text-emerald-500"><AnimatedCounter value={stats.sales - stats.expenses} /></h2>
                                    </div>
                                </div>
                                <div className="flex justify-center">
                                    <button onClick={()=>setModal({type:'expense'})} className="px-10 py-5 bg-rose-600 text-white rounded-3xl font-black text-xl shadow-2xl shadow-rose-600/30 hover:bg-rose-500 active:scale-95 transition-all">تسجيل سحب أو مصروف جديد 💸</button>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-10 text-center opacity-10 text-[9px] font-black uppercase tracking-[1em] no-print">Dream Systems Premium v21</footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
